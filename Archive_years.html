<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nostrools</title>
  <style>
  
    :root {
        --bg-main: #0f172a;       /* Sfondo scuro profondo (slate-900) */
        --bg-card: #1e293b;       /* Sfondo bottoni (slate-800) */
        --bg-hover: #334155;      /* Colore hover (slate-700) */
        --text-main: #f8fafc;     /* Testo principale quasi bianco */
        --text-muted: #94a3b8;    /* Testo secondario */
        --accent: #a855f7;        /* Viola Nostr (purple-500) */
        --font: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
        background-color: var(--bg-main);
        color: var(--text-main);
        font-family: var(--font);
        padding: 40px 15px;
        margin: 0;
    }

    /* 2. STILIZZAZIONE DELLA CLASSE 'TESTO' CHE HAI USATO */
    .testo {
        font-family: var(--font);
        color: var(--text-main);
        background-color: var(--bg-card);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    /* Effetti al passaggio del mouse sui bottoni */
    button.testo:hover {
        background-color: var(--bg-hover);
        border-color: var(--accent);
        transform: translateY(-2px); /* Piccolo effetto sollevamento */
        box-shadow: 0 4px 12px rgba(168, 85, 247, 0.15);
    }

    /* 3. DETTAGLI SPECIFICI DEI COMPONENTI */
    
    /* Il bottone in alto che torna all'Hub */
    .anno-selector button.testo {
        background: linear-gradient(135deg, #6b21a8, var(--accent));
        border: none;
        margin-bottom: 20px;
    }
    .anno-selector button.testo a {
        color: white;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
    }

    /* Il titolo "List of folders" */
    h1.testo {
        background: none;
        border: none;
        font-size: 2rem;
        font-weight: 800;
        margin-top: 10px;
        margin-bottom: 25px;
        color: var(--text-main);
    }

    /* Il menu a tendina dell'anno */
    select.testo {
        background-color: var(--bg-card);
        border: 2px solid var(--bg-hover);
        padding: 8px 12px !important;
        border-radius: 8px;
        outline: none;
    }
    select.testo:focus {
        border-color: var(--accent);
    }

    /* Label "Select Year" */
    label.testo {
        background: none;
        border: none;
        color: var(--text-muted);
    }

    /* 4. RESPONSIVE: Ottimizzazione per Smartphone */
    @media (max-width: 600px) {
        /* Trasforma la griglia da 4 colonne a 2 colonne sui telefoni */
        div[style*="grid-template-columns"] {
            grid-template-columns: repeat(2, 1fr) !important;
        }
        .anno-selector button.testo {
            width: 90% !important; /* Più largo su mobile */
        }
    }
</style>
   

</head>

<div class="anno-selector" style="text-align: center; margin-bottom: 30px;">
  <button class="testo" style="width: 60%; height: 100px;">
    <a href="test_landing_page.html" target="_blank">Nostr Resource Hub</a></button> 
  <b><h1 class="space testo">List of folders</h1></b>
  

  <label for="select-anno" class="testo" style="font-size: 1.2rem; margin-right: 10px;">Select Year:</label>
  <select id="select-anno" class="testo" style="padding: 10px; font-size: 1.1rem; width: 150px;" onchange="aggiornaAnno()">
    <option value="2025" selected>2025</option>
    <option value="2026">2026</option>
    <option value="2027">2027</option>
  </select>
</div>

<div style="max-width: 800px; margin: 0 auto; padding: 0 15px; margin-bottom: 40px;">
  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;">
    <button class="testo tablinks" style="width: 100%; height: 100px;" onclick="apriFileMese('Jan')">Jan</button>
    <button class="testo tablinks" style="width: 100%; height: 100px;" onclick="apriFileMese('February')">February</button>
    <button class="testo tablinks" style="width: 100%; height: 100px;" onclick="apriFileMese('March')">March</button>
    <button class="testo tablinks" style="width: 100%; height: 100px;" onclick="apriFileMese('April')">April</button>
    
    <button class="testo tablinks" style="width: 100%; height: 100px;" onclick="apriFileMese('May')">May</button>
    <button class="testo tablinks" style="width: 100%; height: 100px;" onclick="apriFileMese('June')">June</button>
    <button class="testo tablinks" style="width: 100%; height: 100px;" onclick="apriFileMese('July')">July</button>
    <button class="testo tablinks" style="width: 100%; height: 100px;" onclick="apriFileMese('August')">August</button>
    
    <button class="testo tablinks" style="width: 100%; height: 100px;" onclick="apriFileMese('September')">September</button>
    <button class="testo tablinks" style="width: 100%; height: 100px;" onclick="apriFileMese('October')">October</button>
    <button class="testo tablinks" style="width: 100%; height: 100px;" onclick="apriFileMese('November')">November</button>
    <button class="testo tablinks" style="width: 100%; height: 100px;" onclick="apriFileMese('December')">December</button>
  </div>
</div>

<script>
    // L'anno iniziale impostato di default
    let annoSelezionato = "2025";

    // Funzione che intercetta il cambio della tendina
    function aggiornaAnno() {
        const select = document.getElementById("select-anno");
        annoSelezionato = select.value;
    }

    // Funzione che reindirizza al file locale corretto
    function apriFileMese(mese) {
        // Costruisce la stringa del percorso, ad esempio: "2025/Jan/index.html"
        const percorsoDestinazione = annoSelezionato + "/" + mese + "/index.html";
        
        // Apre la pagina del mese nella stessa scheda del browser
        window.location.href = percorsoDestinazione;
    }
</script>

</body>
</html>
