<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilo Sharp Style</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/nostr-tools/lib/nostr.bundle.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans antialiased">

    <div class="max-w-2xl mx-auto px-4 py-8">
        
        <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 mb-6">
            <a href="index.html" class="inline-flex items-center justify-center gap-2 text-xs text-purple-400 bg-purple-950/60 border border-purple-800/60 px-3 py-1.5 hover:underline font-mono">
                ← Torna indietro
            </a>
            
            
            <div class="flex gap-2">
                <input type="text" id="search-npub-input" placeholder="Cerca npub o inserisci..." class="bg-zinc-900 border border-zinc-800 text-xs px-3 py-1.5 text-zinc-200 font-mono focus:outline-none focus:border-purple-600 w-full sm:w-64">
                <button onclick="handleQuickSearch()" class="bg-zinc-900 border border-zinc-800 text-xs text-purple-400 px-3 py-1.5 font-mono hover:bg-zinc-800 transition-colors">Vai</button>
            </div>
        </div>

        <div id="profile-container" class="bg-zinc-900 border border-zinc-800 p-6 mb-6 shadow-lg">
            <div class="animate-pulse flex space-x-4">
                <div class="bg-zinc-800 h-16 w-16"></div>
                <div class="flex-1 space-y-3 py-1">
                    <div class="h-4 bg-zinc-800 w-3/4"></div>
                    <div class="h-3 bg-zinc-800 w-1/2"></div>
                </div>
            </div>
        </div>

        <div class="flex border-b border-zinc-800 mb-6 overflow-x-auto">
            <button onclick="switchTab('notes')" id="tab-notes" class="tab-btn px-4 py-2.5 text-xs font-mono text-zinc-400 hover:text-zinc-200 border-b-2 border-transparent transition-colors">💬 Note</button>
            <button onclick="switchTab('likes')" id="tab-likes" class="tab-btn px-4 py-2.5 text-xs font-mono text-zinc-400 hover:text-zinc-200 border-b-2 border-transparent transition-colors">❤️ Likes</button>
            <button onclick="switchTab('collections')" id="tab-collections" class="tab-btn px-4 py-2.5 text-xs font-mono text-zinc-400 hover:text-zinc-200 border-b-2 border-transparent transition-colors">📚 Collezioni</button>
            <button onclick="switchTab('relays')" id="tab-relays" class="tab-btn px-4 py-2.5 text-xs font-mono text-zinc-400 hover:text-zinc-200 border-b-2 border-transparent transition-colors">📡 Relay List</button>
            <button onclick="switchTab('discover')" id="tab-discover" class="tab-btn px-4 py-2.5 text-xs font-mono text-zinc-400 hover:text-zinc-200 border-b-2 border-transparent transition-colors">🌐 Discover</button>
        </div>

        <div id="content-container" class="space-y-4">
            <div class="text-zinc-500 text-sm text-center py-8 font-mono">Seleziona una sezione...</div>
        </div>
    </div>
    
   
    <script type="module">
        import { openZapModal } from './ZapPrepar.js';
        import { sendLike } from './likes_zap.js';
        let currentPubkey = '';
        let globalPool = null;
        let cachedNpub = ''; 
        
        const defaultRelays = [
            'wss://relay.damus.io',
            'wss://nos.lol',
            'wss://relay.primal.net',
            'wss://purplepag.es'
        ];

        function getQueryParam(param) {
            return new URLSearchParams(window.location.search).get(param);
        }

        function parseContent(text) {
            if (!text) return '';

            let parsed = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

            parsed = parsed.replace(/\bnostr:(npub1[a-z0-9]+|nprofile1[0-9a-z]+|note1[a-z0-9]+|nevent1[a-z0-9]+|naddr1[0-9a-z]+)/gi, (match, entity) => {
                let url = '#';
                let label = entity.substring(0, 8) + '...';

                if (entity.startsWith('npub') || entity.startsWith('nprofile')) {
                    label = '👤 ' + label;
                    url = `profile-social.html?npub=${entity}`;
                } else if (entity.startsWith('note') || entity.startsWith('nevent')) {
                    label = '💬 ' + label;
                    url = `note.html?nevent=${entity}`;    
                } else if (entity.startsWith('naddr')) {
                    label = '📚 ' + label;
                    url = `modfile.html?naddr=${entity}`;
                }
                return `<a href="${url}" target="_blank" class="text-purple-400 bg-purple-950/60 border border-purple-800/60 px-1 py-0.5 rounded text-[11px] sm:text-xs inline-block font-mono hover:underline max-w-full truncate align-bottom">${label}</a>`;
            });
        
            parsed = parsed.replace(/https?:\/\/[^\s<]+/g, (url) => {
                let matchPunct = url.match(/[.,!?)]+$/);
                let punct = matchPunct ? matchPunct[0] : '';
                let clean = url.substring(0, url.length - punct.length);

                if (/\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i.test(clean)) {
                    return `<br><img src="${clean}" class="mt-2 max-h-60 w-full object-cover border border-zinc-800" loading="lazy"><br>${punct}`;
                }
                if (/\.(mp4|webm|mov)(\?.*)?$/i.test(clean)) {
                    return `<br><video controls class="mt-2 max-h-60 w-full"><source src="${clean}"></video><br>${punct}`;
                }
                return `<a href="${clean}" target="_blank" class="text-purple-400 hover:underline break-all">${clean}</a>${punct}`;
            });
        
            return parsed;
        }

        async function initProfile() {
            const npubParam = getQueryParam('npub');
            if (!npubParam) {
                document.getElementById('profile-container').innerHTML = `<p class="text-red-400">Nessun npub specificato nell'URL.</p>`;
                return;
            }

            cachedNpub = npubParam; 

            try {
                if (npubParam.startsWith('npub')) {
                    currentPubkey = NostrTools.nip19.decode(npubParam).data;
                } else if (npubParam.startsWith('nprofile')) {
                    currentPubkey = NostrTools.nip19.decode(npubParam).data.pubkey;
                } else {
                    currentPubkey = npubParam;
                }
            } catch (e) {
                console.error("Errore decodifica npub:", e);
                return;
            }

            globalPool = new NostrTools.SimplePool();

            try {
                let metaEvent = await globalPool.get(defaultRelays, { kinds: [0], authors: [currentPubkey] });
                let profileData = metaEvent && metaEvent.content ? JSON.parse(metaEvent.content) : {};
                renderProfileHeader(profileData, npubParam);
                switchTab('notes');
            } catch (err) {
                console.error("Errore caricamento profilo:", err);
            }
        }
        
        function renderProfileHeader(profile, npub) {
            const name = profile.display_name || profile.name || npub.substring(0, 12) + '...';
            const about = profile.about ? parseContent(profile.about) : 'Nessuna bio disponibile.';
            const picture = profile.picture || 'https://www.gravatar.com/avatar/?d=mp';
            const banner = profile.banner ? `style="background-image: url('${profile.banner}')"` : '';

            document.getElementById('profile-container').innerHTML = `
                ${profile.banner ? `<div class="h-32 bg-cover bg-center mb-4 -mt-6 -mx-6 border-b border-zinc-800" ${banner}></div>` : ''}
                <div class="flex items-start gap-4">
                    <img src="${picture}" alt="Avatar" class="w-16 h-16 object-cover border border-zinc-700 bg-zinc-800">
                    <div class="flex-1 min-w-0">
                        <h1 class="text-xl font-bold truncate">${escapeHtml(name)}</h1>
                        <div class="flex items-center gap-2 mb-3">
                            <p class="text-xs font-mono text-zinc-500 truncate">npub: ${npub}</p>
                            <button onclick="copyNpub()" class="text-[10px] font-mono bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 px-2 py-0.5 transition-colors cursor-pointer" id="copy-btn">Copia</button>
                        </div>
                        <div class="text-sm text-zinc-300 whitespace-pre-wrap leading-relaxed">${about}</div>
                    </div>
                </div>
            `;
        }

        function copyNpub() {
            if (!cachedNpub) return;
            navigator.clipboard.writeText(cachedNpub).then(() => {
                const btn = document.getElementById('copy-btn');
                if(btn) {
                    btn.innerText = 'Copiato!';
                    btn.classList.add('text-purple-400', 'border-purple-800');
                    setTimeout(() => {
                        btn.innerText = 'Copia';
                        btn.classList.remove('text-purple-400', 'border-purple-800');
                    }, 2000);
                }
            });
        }

          
        const SEARCH_INDEX_KEY = 'nostr_search_index';

        function handleQuickSearch() {
            const inputVal = document.getElementById('search-npub-input').value.trim();
            if (!inputVal) return;
            if (inputVal.startsWith('npub1') || inputVal.startsWith('nprofile1')) {
                window.location.href = `?npub=${inputVal}`;
                return;
            }
            const query = inputVal.toLowerCase();
            let foundHexKey = null;
            try {
                const savedIndex = localStorage.getItem(SEARCH_INDEX_KEY);
                if (savedIndex) {
                    const searchIndex = JSON.parse(savedIndex);

                    for (const [hexKey, fields] of Object.entries(searchIndex)) {
                        if (fields.name.includes(query) || 
                            fields.display_name.includes(query) || 
                            fields.nip05.includes(query)) {
                            foundHexKey = hexKey;
                            break; 
                        }
                    }
                }
            } catch (e) {
                console.error("Errore nella lettura dell'indice di ricerca:", e);
            }
            if (foundHexKey) {
                let targetParam = foundHexKey;
                try {
                    if (window.nip19 && typeof window.nip19.npubEncode === 'function') {
                        targetParam = window.nip19.npubEncode(foundHexKey);
                    }
                } catch (err) {}
            
                window.location.href = `?npub=${targetParam}`;
            } else {
                alert("Nessun profilo trovato nella cache con questo nome.");
            }
        }

        async function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-4 py-2.5 text-xs font-mono text-zinc-400 hover:text-zinc-200 border-b-2 border-transparent transition-colors";
            });
            const activeBtn = document.getElementById(`tab-${tabName}`);
            if (activeBtn) {
                activeBtn.className = "tab-btn px-4 py-2.5 text-xs font-mono text-purple-400 border-b-2 border-purple-400 transition-colors";
            }

            const container = document.getElementById('content-container');
            container.innerHTML = `<div class="text-zinc-500 text-sm text-center py-8 font-mono">Caricamento ${tabName}...</div>`;

            if (!currentPubkey) return;

            try {
                if (tabName === 'notes') {
                    let notes = await globalPool.querySync(defaultRelays, { kinds: [1], authors: [currentPubkey], limit: 20 });
                    notes.sort((a, b) => b.created_at - a.created_at);
                    renderNotesList(notes, container);
                } 
                else if (tabName === 'likes') {
                    let likes = await globalPool.querySync(defaultRelays, { kinds: [7], authors: [currentPubkey], limit: 20 });
                    likes.sort((a, b) => b.created_at - a.created_at);
                    renderLikesList(likes, container);
                } 
                else if (tabName === 'collections') {
                    let bookmarks = await globalPool.get(defaultRelays, { kinds: [10003, 30000], authors: [currentPubkey] });
                    renderCollections(bookmarks, container);
                } 
                else if (tabName === 'relays') {
                    let relayEvent = await globalPool.get(defaultRelays, { kinds: [10002], authors: [currentPubkey] });
                    renderRelayList(relayEvent, container);
                } 
                else if (tabName === 'discover') {
                    renderDiscover(container);
                }
            } catch (e) {
                console.error(e);
                container.innerHTML = `<p class="text-red-400 text-sm text-center py-4 font-mono">Errore nel caricamento dei dati.</p>`;
            }
        }
                        
        function openReplyPage(targetId, rootId, authorPubkey) {
            const replyPayload = {
                target: targetId,
                root: targetId === rootId ? targetId : rootId,
                author: authorPubkey || ''
            };
            const jsonString = JSON.stringify(replyPayload);
            const base64 = btoa(jsonString);
            const base64url = base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            window.location.href = `comment.html?data=${base64url}`;
        }

        function renderNotesList(notes, container) {
            if (!notes || notes.length === 0) {
                container.innerHTML = `<div class="bg-zinc-900 border border-zinc-800 p-4 text-center text-zinc-500 text-sm font-mono">Nessuna nota trovata.</div>`;
                return;
            }
        
            container.innerHTML = notes.map(note => {
                const date = new Date(note.created_at * 1000).toLocaleDateString('it-IT', { 
                    day: 'numeric', 
                    month: 'short', 
                    year: 'numeric', 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
            
                let replyHtml = `<span class="text-[11px] font-mono text-zinc-500">Nota</span>`;
                if (note.tags) {
                    const eTag = note.tags.find(t => t[0] === 'e');
                    const pTag = note.tags.find(t => t[0] === 'p');
                
                    if (eTag) {
                        const targetId = eTag[1];
                        let shortId = targetId.substring(0, 8) + '...';
                        let replyTargetLink = '#';
                        if (pTag && pTag[1] && window.NostrTools && window.NostrTools.nip19) {
                            try {
                                const npub = window.NostrTools.nip19.npubEncode(pTag[1]);
                                shortId = npub.substring(0, 10) + '...' + npub.substring(npub.length - 4);
                                replyTargetLink = `profile-social.html?npub=${npub}`;
                            } catch(e) {}
                        }
                    
                        replyHtml = `
                            <span class="text-[11px] font-mono text-zinc-400 flex items-center gap-1">
                                <span class="text-purple-400">↩</span> Replica a 
                                <a href="${replyTargetLink}" class="text-purple-400 hover:underline font-mono">${shortId}</a>
                            </span>
                        `;
                    }
                }
            
                let rootId = note.id;
                if (note.tags) {
                    const existingRootTag = note.tags.find(t => (t[0] === 'E' || t[0] === 'e') && t[3] === 'root');
                    if (existingRootTag) {
                        rootId = existingRootTag[1];
                    } else {
                        const firstThreadTag = note.tags.find(t => t[0] === 'E' || t[0] === 'e');
                        if (firstThreadTag) {
                            rootId = firstThreadTag[1];
                        }
                    }
                }
            
                let nevent = note.id;
                try {
                    nevent = NostrTools.nip19.neventEncode({
                        id: note.id,
                        relays: ['wss://relay.damus.io', 'wss://nos.lol']
                    });
                } catch(e) {}
            
                const authorPic = 'https://www.gravatar.com/avatar/?d=mp'; 
            
                return `
                    <div class="bg-zinc-900 border border-zinc-800 p-4 mb-4 flex gap-4 hover:border-zinc-700 transition-colors">

                        <div class="flex flex-col shrink-0">
                            <img src="${authorPic}" class="w-10 h-10 object-cover border border-zinc-700 bg-zinc-800" alt="Avatar">
                        </div>
                        <div class="flex-1 min-w-0">

                            <div class="flex justify-between items-center mb-2">
                                <div class="flex items-center gap-2">
                                    <span class="text-xs font-bold text-zinc-200 font-mono">Utente</span>
                                    ${replyHtml}
                                </div>
                                <span class="text-xs text-zinc-500 font-mono">${date}</span>
                            </div>
                        
                        <div class="bg-zinc-950/60 border border-zinc-800/80 p-4 mb-3">
                            <p class="text-sm text-zinc-200 whitespace-pre-wrap leading-relaxed">${parseContent(note.content)}</p>
                        </div>
                    
                        <div class="flex justify-between items-center pt-1 border-t border-zinc-800/40">
                                <div class="flex items-center gap-2">
                                    <button onclick="openReplyPage('${note.id}', '${rootId}', '${note.pubkey}')" class="text-xs font-mono text-zinc-400 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 px-2.5 py-1 transition-colors cursor-pointer">💬 Rispondi</button>
                                    <button onclick="openZapModal('${note.pubkey}', '${note.id}')" class="text-xs font-mono text-zinc-400 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 px-2.5 py-1 transition-colors cursor-pointer">⚡ Pay</button>
                                </div>
                            
                                <div class="flex items-center gap-2">
                                    <button onclick="sendLike('${note.id}', '${note.pubkey}')" class="text-xs font-mono text-zinc-400 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 px-2.5 py-1 transition-colors cursor-pointer">❤️ Like</button>
                                    <a href="note.html?nevent=${nevent}" class="text-xs font-mono text-purple-400 bg-purple-950/60 border border-purple-800/60 px-3 py-1 hover:underline">Apri →</a>
                                </div>
                            </div>
                        
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderLikesList(likes, container) {
            if (!likes || likes.length === 0) {
                container.innerHTML = `<div class="bg-zinc-900 border border-zinc-800 p-4 text-center text-zinc-500 text-sm font-mono">Nessun like trovato.</div>`;
                return;
            }
            container.innerHTML = likes.map(like => {
                const date = new Date(like.created_at * 1000).toLocaleDateString('it-IT', { day: 'numeric', month: 'short' });
                let targetId = null;
                let relayUrl = null;
                let isKind1 = false;

                if (like.tags) {
                    for (let tag of like.tags) {
                        if (tag[0] === 'e') {
                            targetId = tag[1];
                            relayUrl = tag[2] || ''; 
                        }
                        if (tag[0] === 'k' && tag[1] === '1') {
                            isKind1 = true;
                        }
                    }
                }
                const isValidKind1Note = targetId && isKind1;
                let nevent = '';
                if (isValidKind1Note && window.NostrTools && window.NostrTools.nip19) {
                    nevent = window.NostrTools.nip19.neventEncode({
                        id: targetId,
                        relays: relayUrl ? [relayUrl] : []
                    });
                }

                if (nevent) {
                    return `
                        <a href="note.html?nevent=${nevent}" class="bg-zinc-900 border border-zinc-800 p-4 flex justify-between items-center hover:border-zinc-700 transition-colors block group">
                            <span class="text-sm text-zinc-300">Ha messo "Mi piace" (${like.content || '❤️'}) a un post</span>
                            <div class="flex items-center gap-3">
                                <span class="text-xs text-zinc-500 font-mono">${date}</span>
                                <span class="text-xs text-zinc-400 group-hover:text-zinc-200 underline">Apri</span>
                            </div>
                        </a>
                    `;
                } else {
                    return `
                        <div class="bg-zinc-900 border border-zinc-800 p-4 flex justify-between items-center opacity-75">
                            <span class="text-sm text-zinc-300">Ha messo "Mi piace" (${like.content || '❤️'}) a un post</span>
                            <span class="text-xs text-zinc-500 font-mono">${date}</span>
                        </div>
                    `;
                }
            }).join('');
        }

        function renderCollections(bookmarkEvent, container) {
            if (!bookmarkEvent) {
                container.innerHTML = `<div class="bg-zinc-900 border border-zinc-800 p-4 text-center text-zinc-500 text-sm font-mono">Nessun segnalibro trovato.</div>`;
                return;
            }
        
            let nevent = bookmarkEvent.id;
            try {
                nevent = NostrTools.nip19.neventEncode({
                    id: bookmarkEvent.id,
                    relays: ['wss://relay.damus.io', 'wss://nos.lol']
                });
            } catch(e) {}
        
            const date = new Date(bookmarkEvent.created_at * 1000).toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' });
            const kindLabel = bookmarkEvent.kind === 10003 ? 'Bookmarks (Kind 10003)' : `Parameterized List (Kind ${bookmarkEvent.kind})`;
            const totalItems = bookmarkEvent.tags ? bookmarkEvent.tags.length : 0;
        
            container.innerHTML = `
                <div class="bg-zinc-900 border border-zinc-800 p-6 flex flex-col gap-4">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs font-mono text-purple-400 bg-purple-950/60 border border-purple-800/60 px-2 py-0.5">${kindLabel}</span>
                            <p class="text-xs text-zinc-500 font-mono mt-2">Aggiornato il: ${date} | Contiene ${totalItems} elementi</p>
                        </div>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-zinc-800">
                        <span class="text-xs text-zinc-400 font-mono truncate max-w-xs">ID: ${bookmarkEvent.id}</span>
                        <a href="feed.html?nevent=${nevent}" class="text-xs text-purple-400 bg-purple-950/60 border border-purple-800/60 px-3 py-1.5 hover:underline font-mono">
                            Apri la lista in Feed →
                        </a>
                    </div>
                </div>
            `;
        }

        function renderRelayList(relayEvent, container) {
            if (!relayEvent || !relayEvent.tags) {
                container.innerHTML = `<div class="bg-zinc-900 border border-zinc-800 p-4 text-center text-zinc-500 text-sm font-mono">Nessuna lista relay pubblica trovata.</div>`;
                return;
            }
            let relays = relayEvent.tags.filter(t => t[0] === 'r').map(t => ({ url: t[1], mode: t[2] || 'read/write' }));
            container.innerHTML = relays.map(r => `
                <div class="bg-zinc-900 border border-zinc-800 p-4 flex justify-between items-center">
                    <span class="text-sm font-mono text-blue-300">${escapeHtml(r.url)}</span>
                    <span class="text-xs text-zinc-500 bg-zinc-800 px-2 py-0.5">${r.mode}</span>
                </div>
            `).join('');
        }

        function renderDiscover(container) {
            container.innerHTML = `
                <div class="bg-zinc-900 border border-zinc-800 p-6 text-center">
                    <h3 class="font-bold text-base mb-2 text-zinc-200 font-mono">Relay Discover & Network</h3>
                    <p class="text-xs text-zinc-400 mb-4">Questa sezione mostra i relay raccomandati e i nodi scoperti attraverso l'attività recente dell'utente.</p>
                    <div class="text-xs font-mono text-purple-400 bg-purple-950/40 border border-purple-800/40 p-3 inline-block">
                        Stato rete: Connessione attiva ai relay pubblici principali.
                    </div>
                </div>
            `;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        initProfile();
        window.switchTab = switchTab;
        window.handleQuickSearch= handleQuickSearch
        window.openZapModal = openZapModal;
        window.sendLike = async (targetId, targetAuthorPubkey) => {
        await sendLike(defaultRelays, targetId, targetAuthorPubkey);
    };

    </script>
    
</body>
</html>
