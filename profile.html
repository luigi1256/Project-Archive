<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostr Profile</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <header class="max-w-3xl mx-auto pt-12 pb-6 px-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-purple-400">Nostr Profilo (Kind 0)</h1>
        <a href="resource_hub.html" class="px-4 py-2 bg-gray-700 rounded-lg text-sm font-medium hover:bg-gray-600 transition">← Torna Indietro</a>
    </header>

    <main class="max-w-3xl mx-auto px-4 pb-24">
        <div id="loading" class="text-center text-gray-400 text-lg py-12">Caricamento profilo in corso...</div>

        <div id="profileContainer" class="hidden bg-gray-800 border border-gray-700 rounded-2xl overflow-hidden shadow-xl">
            <div id="profileBanner" class="h-40 bg-gray-700 bg-cover bg-center"></div>
                <div class="px-6 pb-6 relative">
                
                <div class="flex justify-between items-end -mt-16 mb-4">
                    <img id="profilePicture" src="https://via.placeholder.com/150" alt="Avatar" class="w-32 h-32 rounded-full border-4 border-gray-800 bg-gray-900 object-cover shadow-lg">
                    <a id="externalProfile" href="#" target="_blank" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white text-sm font-semibold rounded-lg transition shadow">Apri Profilo</a>
                </div>

                <h2 id="profileName" class="text-3xl font-extrabold text-white">Nome Utente</h2>
                <p id="profileDisplayName" class="text-purple-400 text-sm mb-4">@display_name</p>                                                                               
                <p id="profileAbout" class="text-sm text-zinc-300 whitespace-pre-wrap leading-relaxed break-words min-w-0">Bio utente...</p>
               
                <div class="space-y-3 text-xs font-mono bg-gray-900 p-4 rounded-xl border border-gray-800">
                    <div>
                        <span class="text-gray-500 block mb-1">NPUB:</span>
                        <span id="profileNpub" class="text-purple-300 break-all select-all">npub1...</span>
                    </div>
                    <div>
                        <span class="text-gray-500 block mb-1">HEX Pubkey:</span>
                        <span id="profileHex" class="text-gray-400 break-all select-all">...</span>
                    </div>
                    <div id="profileWebsiteContainer" class="hidden">
                        <span class="text-gray-500 block mb-1">Sito Web:</span>
                        <a id="profileWebsite" href="#" target="_blank" class="text-blue-400 hover:underline break-all">...</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="cache.js"></script>
    <script type="module">
        import { SimplePool, nip19 } from 'https://cdn.jsdelivr.net/npm/nostr-tools/+esm'
         
        const INITIAL_RELAYS = [
            'wss://relay.damus.io',
            'wss://nos.lol',
            'wss://relay.ditto.pub',
        ];

        const pool = new SimplePool();
        
        function parseContent(text) {
            if (!text) return '';

            let parsed = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

            parsed = parsed.replace(/\bnostr:(npub1[a-z0-9]+|nprofile1[0-9a-z]+|note1[a-z0-9]+|nevent1[0-9a-z]+|naddr1[0-9a-z]+)/gi, (match, entity) => {
                let url = '#';
                let label = entity.substring(0, 8) + '...';
                
                if (entity.startsWith('npub') || entity.startsWith('nprofile')) {
                    try {
                        const decoded = nip19.decode(entity);
                        if (decoded.type === 'npub') {
                            // hexKey = decoded.data; // Rimosso se non globale o gestito altrove
                        } else if (decoded.type === 'nprofile') {
                            // hexKey = decoded.data.pubkey;
                        }
                    } catch (e) {
                        console.warn("Errore nel decode di npub/nprofile:", e);
                    }
                    
                    const profile = typeof getProfileFromCache === 'function' ? getProfileFromCache(entity) : null;
                    if (profile) {
                        const name = profile.display_name || profile.name || entity.substring(0, 8) + '...';
                        label = '👤 ' + name;
                    } else {
                        label = '👤 ' + entity.substring(0, 8) + '...';
                    }
                    url = `profile.html?npub=${entity}`;
                } else if (entity.startsWith('note') || entity.startsWith('nevent')) {
                    label = '💬 ' + label;
                    url = `note.html?nevent=${entity}`;    
                } else if (entity.startsWith('naddr')) {
                    label = '📚 ' + label;
                    url = `modfile.html?naddr=${entity}`;
                }
                return `<a href="${url}" target="_blank" class="text-purple-400 bg-purple-950/60 border border-purple-800/60 px-1 py-0.5 rounded text-[11px] sm:text-xs inline-block font-mono hover:underline max-w-full truncate align-bottom">${label}</a>`;
            });

            parsed = parsed.replace(/https?:\/\/[^\s<]+/g, (url) => {
                let matchPunct = url.match(/[.,!?)]+$/);
                let punct = matchPunct ? matchPunct[0] : '';
                let clean = url.substring(0, url.length - punct.length);
                
                if (/\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i.test(clean)) {
                    return `<br><img src="${clean}" class="mt-2 max-h-60 sm:max-h-80 w-full rounded-lg object-cover border border-gray-700" loading="lazy"><br>${punct}`;
                }
                if (/\.(mp4|webm|mov)(\?.*)?$/i.test(clean)) {
                    return `<br><video controls class="mt-2 max-h-60 sm:max-h-80 w-full rounded-lg"><source src="${clean}"></video><br>${punct}`;
                }
                if (/\.(mp3|ogg|wav)(\?.*)?$/i.test(clean)) {
                    return `<br><audio controls class="mt-2 w-full"><source src="${clean}"></audio><br>${punct}`;
                }
                return `<a href="${clean}" target="_blank" class="text-purple-400 hover:underline break-all">${clean}</a>${punct}`;
            });

            return parsed;
        }

        async function initProfile() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const rawParam = urlParams.get('npub') || urlParams.get('nprofile') || urlParams.get('pubkey');

                let targetPubkey = null;
                let queryRelays = [...INITIAL_RELAYS];

                if (!rawParam) {
                    document.getElementById('loading').innerText = "Nessun parametro valido specificato nell'URL.";
                    return;
                }

                if (rawParam.startsWith('npub1') || rawParam.startsWith('nprofile1')) {
                    const decoded = nip19.decode(rawParam);
                    if (decoded.type === 'npub') {
                        targetPubkey = decoded.data;
                    } else if (decoded.type === 'nprofile') {
                        targetPubkey = decoded.data.pubkey;
                        if (decoded.data.relays && decoded.data.relays.length > 0) {
                            queryRelays = [...decoded.data.relays, ...INITIAL_RELAYS];
                        }
                    }
                } else {
                    targetPubkey = rawParam;
                }

                if (!targetPubkey) {
                    document.getElementById('loading').innerText = "Impossibile estrarre una chiave pubblica valida.";
                    return;
                }

                const events = await pool.querySync(queryRelays, {
                    authors: [targetPubkey],
                    kinds: [0],
                    limit: 1
                });

                let profileData = {};
                if (events.length > 0) {
                    try {
                        profileData = JSON.parse(events[0].content);
                    } catch (e) {
                        console.error("Errore nel parsing del JSON del Kind 0", e);
                    }
                }

                const npub = nip19.npubEncode(targetPubkey);
                const aboutbio = profileData.about;
                const bioParsed = aboutbio ? parseContent(aboutbio) : 'Nessuna bio disponibile.';
                
                document.getElementById('profileName').innerText = profileData.name || profileData.username || 'Sconosciuto';
                document.getElementById('profileDisplayName').innerText = profileData.display_name ? `@${profileData.display_name}` : `@${npub.substring(0, 10)}...`;
                document.getElementById('profileAbout').innerHTML = bioParsed;
                document.getElementById('profileNpub').innerText = npub;
                document.getElementById('profileHex').innerText = targetPubkey;

                if (profileData.picture) {
                    if (typeof setProfileCache === 'function') {
                        setProfileCache(targetPubkey, profileData);
                    }
                    document.getElementById('profilePicture').src = profileData.picture;
                }
                if (profileData.banner) {
                    const banner = document.getElementById('profileBanner');
                    banner.style.backgroundImage = `url('${profileData.banner}')`;
                }
                if (profileData.website) {
                    const webContainer = document.getElementById('profileWebsiteContainer');
                    const webLink = document.getElementById('profileWebsite');
                    webLink.href = profileData.website;
                    webLink.innerText = profileData.website;
                    webContainer.classList.remove('hidden');
                }

                document.getElementById('externalProfile').href = `profile-social.html?npub=${npub}`;

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('profileContainer').classList.remove('hidden');

            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerText = "Errore durante il caricamento del profilo.";
            }
        }

        initProfile();
    </script>
</body>
</html>
