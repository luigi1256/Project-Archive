<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tag Note</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="mac.css">
<style>
  
  .main-post-card {
    background: linear-gradient(145deg, rgba(46, 26, 71, 0.45) 0%, rgba(24, 24, 27, 0.92) 100%);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(192, 132, 252, 0.35);
    border-left: 4px solid #c084fc;
    border-radius: 12px;
    padding: 22px;
    box-shadow: 0 12px 35px rgba(88, 28, 135, 0.2), 0 4px 15px rgba(0, 0, 0, 0.5);
  }

  .comment-card {
    background: rgba(18, 18, 20, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 8px;
    padding: 12px;
    transition: border-color 0.2s ease;
  }
  .comment-card:hover {
    border-color: rgba(255, 255, 255, 0.15);
  }

  .nostur-hashtag {
    color: var(--nostur-accent-purple, #c084fc);
    font-weight: 600;
    text-decoration: none;
  }
  .nostur-hashtag:hover { text-decoration: underline; }

  .tag-pill {
    display: inline-flex;
    align-items: center;
    padding: 3px 9px;
    border-radius: 9999px;
    font-size: 11px;
    font-family: monospace;
    background: rgba(192, 132, 252, 0.12);
    color: #e9d5ff;
    border: 1px solid rgba(192, 132, 252, 0.3);
    text-decoration: none;
    transition: all 0.15s ease;
  }
  .tag-pill:hover {
    background: rgba(192, 132, 252, 0.25);
    border-color: #c084fc;
    color: #ffffff;
  }

  .nostur-entity-badge {
    border: 1px solid rgba(192, 132, 252, 0.3);
    background-color: rgba(192, 132, 252, 0.06);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.85em;
    font-family: monospace;
    color: var(--nostur-accent-purple, #c084fc);
    display: inline-block;
  }

  .nostur-link-badge {
    display: inline-flex;
    gap: 6px;
    padding: 4px 8px;
    margin: 4px 0;
    border-radius: 6px;
    font-size: 0.85em;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(10, 10, 12, 0.5);
    color: #e1e1e6;
    text-decoration: none;
  }
  .nostur-link-badge:hover { border-color: rgba(192, 132, 252, 0.4); }
</style>
</head>
<body class="bg-[#121214] text-[#e1e1e6] min-h-screen font-sans">

<header class="w-full border-b border-white/10 bg-[#121214]/80 backdrop-blur-md sticky top-0 z-50 px-4 py-3">
  <div class="max-w-3xl mx-auto flex justify-between items-center">
    <a href="readtag.html" class="inline-flex items-center gap-2 px-3 py-1.5 bg-white/5 hover:bg-white/10 text-[#e1e1e6] rounded-lg font-medium transition text-xs border border-white/10">
      ← Back to Tag
    </a>
    <span class="font-mono text-xs text-purple-400 font-semibold">Single Note</span>
    <a href="index.html" class="inline-flex items-center gap-1 px-3 py-1.5 bg-white/5 hover:bg-white/10 text-[#e1e1e6] rounded-lg font-medium transition text-xs border border-white/10">
      🏠 Home
    </a>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-8">

  <div id="loading" class="text-center font-mono text-xs text-purple-400 py-12">
    ⏳ Loading note from relays...
  </div>

  <div id="errorBox" class="hidden text-center font-mono text-xs text-red-400 py-12">
    ❌ Note not found or invalid nevent.
  </div>
  
  <article id="mainPost" class="main-post-card hidden mb-8">
 
    <div class="flex justify-between items-center mb-4 border-b border-purple-400/20 pb-3 font-mono text-xs">
      <div class="flex items-center gap-2.5">
        <span class="text-lg">👤</span>
        <div>
          <div class="flex items-center gap-2">
            <span id="authorPubkey" class="text-purple-200 font-bold">u/Loading...</span>
            <span class="text-[9px] uppercase tracking-wider bg-purple-500/25 text-purple-200 border border-purple-400/40 px-1.5 py-0.5 rounded font-semibold">Original Note</span>
          </div>
          <div id="postDate" class="text-white/50 text-[10px] mt-0.5">--</div>
        </div>
      </div>
      <a id="authorProfileLink" href="#" target="_blank" class="text-purple-300 hover:text-white hover:underline">View Profile ↗</a>
    </div>
  
    <div id="postContent" class="whitespace-pre-wrap leading-relaxed break-words text-sm mb-5 text-[#f4f4f5]"></div>

    <div id="noteTagsRecap" class="hidden mb-5 pt-3 border-t border-purple-400/15">
      <div class="text-[10px] font-mono uppercase tracking-wider text-purple-300/70 mb-2">🏷️ Tags in this note</div>
      <div id="noteTagsList" class="flex flex-wrap gap-1.5"></div>
    </div>
    
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 border-t border-b border-purple-400/20 py-3 my-4 font-mono text-xs text-center bg-black/30 rounded-xl">
      <div class="flex flex-col items-center justify-center border-r border-white/10 last:border-r-0">
        <span class="text-[10px] text-white/40 uppercase">Reactions</span>
        <div class="flex items-center gap-1.5 mt-0.5">
          <span class="text-purple-400">❤️</span>
          <span id="voteCount" class="text-purple-200 font-semibold">0</span>
        </div>
      </div>

      <div class="flex flex-col items-center justify-center border-r border-white/10 last:border-r-0">
        <span class="text-[10px] text-white/40 uppercase">Comments</span>
        <span id="commentCountBadge" class="text-purple-200 font-semibold mt-0.5">0</span>
      </div>

      <div class="flex flex-col items-center justify-center border-r border-white/10 last:border-r-0">
        <span class="text-[10px] text-white/40 uppercase">Zaps</span>
        <span id="zapCountBadge" class="text-amber-300 font-semibold mt-0.5">⚡ 0 sats</span>
      </div>

      <div class="flex flex-col items-center justify-center">
        <span class="text-[10px] text-white/40 uppercase">Reposts</span>
        <span id="repostCountBadge" class="text-sky-300 font-semibold mt-0.5">🔄 0</span>
      </div>
    </div>

    <div class="flex items-center justify-between pt-2 text-xs font-mono">
      <button onclick="copyNoteLink()" class="px-3 py-1.5 bg-white/5 hover:bg-white/10 rounded-lg border border-white/10 transition text-white/80 cursor-pointer">
        🔗 Copy Link
      </button>
      <button onclick="alert('Zap feature ready to connect!')" class="px-3 py-1.5 bg-purple-500/20 hover:bg-purple-500/30 text-purple-200 rounded-lg border border-purple-400/40 transition cursor-pointer">
        ⚡ Send Zap
      </button>
    </div>
  </article>

  <section id="commentsSection" class="hidden">
    <h2 class="text-xs font-mono text-[#a1a1aa] uppercase tracking-wider mb-3 border-b border-white/10 pb-2">
      💬 Comments / Replies
    </h2>
    <div id="commentsList" class="space-y-3"></div>
  </section>

</main>

<script src="baita_core.js"></script>
<script type="module">
import { nip19 } from 'https://cdn.jsdelivr.net/npm/nostr-tools/+esm'

const loadingDiv = document.getElementById("loading");
const errorBox = document.getElementById("errorBox");
const mainPost = document.getElementById("mainPost");
const commentsSection = document.getElementById("commentsSection");
const commentsList = document.getElementById("commentsList");

const postContent = document.getElementById("postContent");
const authorPubkey = document.getElementById("authorPubkey");
const postDate = document.getElementById("postDate");
const authorProfileLink = document.getElementById("authorProfileLink");
const voteCountEl = document.getElementById("voteCount");
const commentCountBadge = document.getElementById("commentCountBadge");
const zapCountBadge = document.getElementById("zapCountBadge");
const repostCountBadge = document.getElementById("repostCountBadge");

const noteTagsRecap = document.getElementById("noteTagsRecap");
const noteTagsList = document.getElementById("noteTagsList");

let mainNoteLikes = 0;
let commentCount = 0;
let totalZapsSats = 0;
let repostCount = 0;

let countedReactionIds = new Set();
let countedCommentIds = new Set();
let countedZapIds = new Set();

function parseNostrContent(content) {
    if (!content) return '';
  
    let parsed = content.replace(/nostr:(note1[0-9a-z]+|nevent1[0-9a-z]+|npub1[0-9a-z]+|nprofile1[0-9a-z]+|naddr1[0-9a-z]+)/gi, (match, entity) => {
        let url = '#';
        let label = entity.substring(0, 10) + '...';
        if (entity.startsWith('npub') || entity.startsWith('nprofile')) {
            label = '👤 ' + label;
            url = `TagProfile.html?npub=${entity}`;
        } else if (entity.startsWith('note') || entity.startsWith('nevent')) {
            label = '💬 ' + label;
            url = `TagNote.html?nevent=${entity}`;                
        } else if (entity.startsWith('naddr')) {
            label = '📚 ' + label;
            url = `modfile.html?naddr=${entity}`;
        }
        return `<a href="${url}" target="_blank" class="nostur-entity-badge">${label}</a>`;
    });

    const hashtagRegex = /(^|\s)#([a-zA-Z0-9_]+)/g;
    parsed = parsed.replace(hashtagRegex, (match, space, tag) => {
        return `${space}<a href="readtag.html?t=${tag}" target="_blank" class="nostur-hashtag">#${tag}</a>`;
    });

    const urlRegex = /(https?:\/\/[^\s]+)/g;
    parsed = parsed.replace(urlRegex, (url) => {
        let cleanUrl = url.replace(/[.,!?)]$/, '');
        let trailing = url.slice(cleanUrl.length);
        
        if (cleanUrl.includes('njump.to') || cleanUrl.includes('njump.me')) return url;
        let lower = cleanUrl.toLowerCase();
        
        let typeBadge = "🔗 Link";
        if (lower.match(/\.(jpeg|jpg|gif|png|webp|svg)(\?.*)?$/i) || lower.includes('image') || lower.includes('imgur') || lower.includes('primal.net/media')) {
            typeBadge = "🖼️ Photo";
        } else if (lower.match(/\.(mp4|webm|mov|ogg)(\?.*)?$/i) || lower.includes('youtube.com') || lower.includes('youtu.be') || lower.includes('rumble.com') || lower.includes('twitch.tv')) {
            typeBadge = "🎬 Video";
        }
        let displayUrl = cleanUrl.replace(/^https?:\/\/(www\.)?/, '');
        if (displayUrl.length > 35) displayUrl = displayUrl.substring(0, 32) + '...';
        
        return `<a href="${cleanUrl}" target="_blank" class="nostur-link-badge"><span style="opacity:0.8">${typeBadge}</span> ${displayUrl}</a>${trailing}`;
    });

    return parsed;
}

function renderNoteTagsRecap(ev) {
    const tagsSet = new Set();
    if (Array.isArray(ev.tags)) {
        ev.tags.forEach(t => {
            if (t[0] === 't' && t[1]) {
                tagsSet.add(t[1].trim().toLowerCase());
            }
        });
    }

    if (ev.content) {
        const matches = ev.content.matchAll(/(?:^|\s)#([a-zA-Z0-9_]+)/g);
        for (const m of matches) {
            tagsSet.add(m[1].toLowerCase());
        }
    }

    if (tagsSet.size > 0) {
        noteTagsList.innerHTML = Array.from(tagsSet)
            .sort()
            .map(tag => `<a href="readtag.html?t=${encodeURIComponent(tag)}" class="tag-pill">#${tag}</a>`)
            .join('');
        noteTagsRecap.classList.remove("hidden");
    } else {
        noteTagsRecap.classList.add("hidden");
    }
}

document.addEventListener("DOMContentLoaded", () => {
  const urlParams = new URLSearchParams(window.location.search);
  let neventParam = urlParams.get('nevent');
  let idParam = urlParams.get('id');

  let targetEventId = "";

  if (neventParam) {
    try {
      let decoded = nip19.decode(neventParam);
      if (decoded.type === 'nevent') {
        targetEventId = decoded.data.id;
      } else if (decoded.type === 'note') {
        targetEventId = decoded.data;
      }
    } catch (err) {
      console.error("Invalid nevent", err);
    }
  } else if (idParam) {
    targetEventId = idParam;
  }

  if (!targetEventId) {
    loadingDiv.classList.add("hidden");
    errorBox.classList.remove("hidden");
    return;
  }

  fetchSingleNote(targetEventId);
});

function fetchSingleNote(eventId) {
  const Relays = [
    "wss://relay.damus.io",  
    "wss://relay.primal.net",
    "wss://relay.ditto.pub/"
  ];

  let found = false;

  Relays.forEach(relayUrl => {
    const ws = new WebSocket(relayUrl);

    ws.onopen = () => {
      ws.send(JSON.stringify(["REQ", "baita_single_note", { ids: [eventId] }]));
      ws.send(JSON.stringify(["REQ", "baita_comments", { kinds: [1, 6], "#e": [eventId], limit: 40 }]));
      ws.send(JSON.stringify(["REQ", "baita_likes", { kinds: [7], "#e": [eventId] }]));
      ws.send(JSON.stringify(["REQ", "baita_zaps", { kinds: [9735], "#e": [eventId] }]));
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        
        if (data[0] === "EVENT") {
          const ev = data[2];
          if (ev.id === eventId && !found) {
            found = true;
            renderMainPost(ev);
            loadingDiv.classList.add("hidden");
            mainPost.classList.remove("hidden");
          } else if (ev.tags.some(t => t[0] === 'e' && t[1] === eventId)) {
            if (ev.kind === 7) {
              if (!countedReactionIds.has(ev.id)) {
                countedReactionIds.add(ev.id);
                mainNoteLikes++;
                if (voteCountEl) voteCountEl.textContent = mainNoteLikes;
              }
            } 
            else if (ev.kind === 6) {
              if (!countedReactionIds.has(ev.id)) {
                countedReactionIds.add(ev.id);
                repostCount++;
                if (repostCountBadge) repostCountBadge.textContent = `🔄 ${repostCount}`;
              }
            }
            else if (ev.kind === 1) {
              if (!countedCommentIds.has(ev.id)) {
                countedCommentIds.add(ev.id);
                commentCount++;
                if (commentCountBadge) commentCountBadge.textContent = commentCount;
                renderComment(ev);
                commentsSection.classList.remove("hidden");
              }
            }
            else if (ev.kind === 9735) {
              if (!countedZapIds.has(ev.id)) {
                countedZapIds.add(ev.id);
                let sats = extractZapAmount(ev);
                totalZapsSats += sats;
                if (zapCountBadge) zapCountBadge.textContent = `⚡ ${totalZapsSats.toLocaleString()} sats`;
              }
            }
          }
        }
      } catch (err) {
        console.error("Error reading relay", err);
      }
    };

    ws.onerror = () => checkComplete();
    ws.onclose = () => checkComplete();
  });

  function checkComplete() {
    setTimeout(() => {
      if (!found && loadingDiv.classList.contains("hidden") === false) {
        loadingDiv.classList.add("hidden");
        errorBox.classList.remove("hidden");
      }
    }, 3000);
  }
}

function extractZapAmount(zapEvent) {
  try {
    let descTag = zapEvent.tags.find(t => t[0] === 'description');
    if (descTag && descTag[1]) {
      let parsedDesc = JSON.parse(descTag[1]);
      let amountTag = parsedDesc.tags.find(t => t[0] === 'amount');
      if (amountTag && amountTag[1]) {
        return Math.floor(parseInt(amountTag[1]) / 1000);
      }
    }
  } catch(e) {}
  return 0;
}

function renderMainPost(ev) {
  try {
    let npub = nip19.npubEncode(ev.pubkey);
    authorPubkey.textContent = `u/${ev.pubkey.substring(0, 6)}...`;
    authorProfileLink.href = `TagProfile.html?npub=${npub}`;
  } catch (e) {
    authorPubkey.textContent = `u/${ev.pubkey.substring(0, 6)}...`;
  }

  postDate.textContent = new Date(ev.created_at * 1000).toLocaleString();
  postContent.innerHTML = parseNostrContent(ev.content);
  renderNoteTagsRecap(ev);
}

function renderComment(ev) {
  const commentDiv = document.createElement("div");
  commentDiv.className = "comment-card text-xs";
  
  let shortPubkey = ev.pubkey.substring(0, 8) + '...';
  let formattedComment = parseNostrContent(ev.content);

  commentDiv.innerHTML = `
    <div class="flex justify-between items-center mb-1.5 opacity-60 font-mono text-[10px] border-b border-white/5 pb-1">
      <span class="text-purple-300 font-semibold">u/${shortPubkey}</span>
      <span>${new Date(ev.created_at * 1000).toLocaleDateString()}</span>
    </div>
    <div class="whitespace-pre-wrap leading-relaxed break-words text-[#e1e1e6]">${formattedComment}</div>
  `;

  commentsList.appendChild(commentDiv);
}

window.copyNoteLink = function() {
  navigator.clipboard.writeText(window.location.href);
  alert("Link copied to clipboard!");
}
</script>

</body>
</html>
