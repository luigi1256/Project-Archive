<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tag Reader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="mac.css">
<link rel="stylesheet" href="readtag.css">
<style>
  .note-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    transition: all 0.2s ease;
  }
  .note-card:hover {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(255, 255, 255, 0.15);
  }
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

<button id="toggleShelf" onclick="toggleShelf()" class="fixed top-4 left-4 z-50 bg-slate-900/80 text-slate-200 border border-slate-700/60 px-3.5 py-2 rounded-xl text-sm font-medium hover:bg-slate-800 backdrop-blur-md shadow-lg transition-all">📚 Shelf</button>

<aside id="shelf" class="fixed top-0 left-0 h-full w-72 bg-slate-900/95 border-r border-slate-800 p-5 transform -translate-x-full transition-transform duration-300 z-40 backdrop-blur-xl">
    <h2 class="text-slate-400 font-semibold text-xs tracking-wider uppercase border-b border-slate-800 pb-3">My saved tags</h2>
    <div id="books" class="mt-4 overflow-y-auto flex-1"></div>
</aside>

<div id="main" class="w-full px-4 sm:px-6 pt-16 max-w-3xl mx-auto transition-all duration-300">
                                                                                                                                                                                                                                                                                          
    <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-white tracking-tight mb-3">Tag Reader</h1>                                                                                                                                                                                                                                                                                
        <div class="flex items-center justify-center gap-2.5">                                                                                                                                                          
          <a href="Search.html" target="_blank" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 rounded-xl font-medium transition text-sm border border-slate-800 shadow-sm">
            <span>Search</span>  
          </a>
          <a href="index.html" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 rounded-xl font-medium transition text-sm border border-slate-800 shadow-sm">
            <span>🏠 Home</span>
          </a>
        </div>
    </div>                                                                                                                                                                                                                                                                                                                                          
              
  <div id="searchArea" class="flex justify-center mb-3">
    <form id="searchForm" onsubmit="event.preventDefault();" class="w-full flex justify-center">
      <div id="searchContainer" class="flex items-center gap-2.5 w-full">
        <div class="relative flex-1 flex">
          <input
            id="searchBar"
            type="text"
            placeholder="Enter tags, e.g. asknostr, art..."
            aria-label="Search tags"
            class="w-full text-sm px-4 py-3 rounded-xl border border-slate-800 outline-none bg-slate-900/70 text-white shadow-inner focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all"
          >
        </div>
        
        <button id="searchButton" type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm px-6 py-3 rounded-xl transition shadow-md cursor-pointer">
          🏷️ Read
        </button>
      </div>
    </form>
  </div>

<div class="mb-8 px-1 text-center">
  <p class="text-xs text-slate-400 m-0">
    Tip: Query multiple tags using commas (e.g. <code class="bg-slate-900 px-2 py-0.5 rounded border border-slate-800 text-indigo-300">asknostr, art</code>)
  </p>
</div>  

  <div id="library" class="hidden bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-5 sm:p-7 shadow-xl mb-12">
    <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
      <span id="libraryTitle" class="text-xs font-semibold text-indigo-400 uppercase tracking-wider"></span>
      <button onclick="closeLibrary()" class="text-xs text-slate-400 hover:text-white px-3 py-1.5 rounded-lg bg-slate-800/60 border border-slate-700/50 transition-colors">
        ✖ Close folder
      </button>
    </div>

    <div id="loading" class="text-xs text-indigo-400 mb-4 hidden text-center py-6">
      ⏳ Loading tags...
    </div>
       
    <div id="results" class="space-y-8"></div>

    <div id="tagCloudFooter" class="mt-8 pt-5 border-t border-slate-800 hidden">
      <div class="text-xs text-slate-400 uppercase tracking-wider mb-3 font-medium">🏷️ Related Tags & Categories</div>
      <div id="tagCloudContainer" class="flex flex-wrap gap-2"></div>
    </div>
  </div>
</div>

<script src="baita_core.js"></script>
<script type="module">
import { nip19 } from 'https://cdn.jsdelivr.net/npm/nostr-tools/+esm'  

const searchBar = document.getElementById("searchBar");
const searchButton = document.getElementById("searchButton");
const library = document.getElementById("library");
const resultsDiv = document.getElementById("results");
const loadingDiv = document.getElementById("loading");
const libraryTitle = document.getElementById("libraryTitle");
const tagCloudFooter = document.getElementById("tagCloudFooter");
const tagCloudContainer = document.getElementById("tagCloudContainer");

let collectedNotesByAuthor = new Map();
let currentLoadedTagsSet = new Set();
let authorMetadataCache = new Map();

const SHOW_PUBKEY = false; 

function parseNostrContent(content) {
    if (!content) return '';
  
    let parsed = content.replace(/nostr:(note1[0-9a-z]+|nevent1[0-9a-z]+|npub1[0-9a-z]+|nprofile1[0-9a-z]+|naddr1[0-9a-z]+)/gi, (match, entity) => {
        let url = '#';
        let label = entity.substring(0, 10) + '...';
        if (entity.startsWith('npub') || entity.startsWith('nprofile')) {
            label = '👤 ' + label;
            url = `profile.html?npub=${entity}`;
        } else if (entity.startsWith('note') || entity.startsWith('nevent')) {
            label = '💬 ' + label;
            url = `Tagnote.html?nevent=${entity}`;                
        } else if (entity.startsWith('naddr')) {
            label = '📚 ' + label;
            url = `modfile.html?naddr=${entity}`;
        }
        return `<a href="${url}" target="_blank" class="text-indigo-400 hover:underline bg-indigo-500/10 px-1 rounded">${label}</a>`;
    });

    const hashtagRegex = /(^|\s)#([a-zA-Z0-9_]+)/g;
    parsed = parsed.replace(hashtagRegex, (match, space, tag) => {
        currentLoadedTagsSet.add(tag.toLowerCase());
        return `${space}<a href="readtag.html?t=${tag}" target="_blank" class="text-indigo-300 hover:underline font-medium">#${tag}</a>`;
    });

    const urlRegex = /(https?:\/\/[^\s]+)/g;
    parsed = parsed.replace(urlRegex, (url) => {
        let cleanUrl = url.replace(/[.,!?)]$/, '');
        let trailing = url.slice(cleanUrl.length);
        
        if (cleanUrl.includes('njump.to') || cleanUrl.includes('njump.me')) return url;
        let lower = cleanUrl.toLowerCase();
        
        let typeBadge = "🔗";
        if (lower.match(/\.(jpeg|jpg|gif|png|webp|svg)(\?.*)?$/i) || lower.includes('image') || lower.includes('imgur') || lower.includes('primal.net/media')) {
            typeBadge = "🖼️";
        } else if (lower.match(/\.(mp4|webm|mov|ogg)(\?.*)?$/i) || lower.includes('youtube.com') || lower.includes('youtu.be')) {
            typeBadge = "🎬";
        }
        let displayUrl = cleanUrl.replace(/^https?:\/\/(www\.)?/, '');
        if (displayUrl.length > 25) displayUrl = displayUrl.substring(0, 22) + '...';
        
        return `<a href="${cleanUrl}" target="_blank" class="text-indigo-400 hover:underline inline-flex items-center gap-1 bg-slate-800/80 px-1.5 py-0.5 rounded text-xs"><span>${typeBadge}</span> ${displayUrl}</a>${trailing}`;
    });

    return parsed;
}

function executeTagReader(rawInput) {
  if (!rawInput) return;
  
  let tags = rawInput
    .split(/[\s,]+/)
    .map(t => t.replace(/^#/, "").trim().toLowerCase())
    .filter(t => t.length > 0);

  if (tags.length === 0) return;

  tags.forEach(t => currentLoadedTagsSet.add(t));
  const tagQueryString = tags.join(",");

  if (library) library.style.display = "block";
  if (libraryTitle) libraryTitle.textContent = `Tags: #${tags.join(" #")}`;

  let books = JSON.parse(localStorage.getItem("nostr_shelf")) || {};
  let shelfKey = `#${tagQueryString}`;
  if (!books[shelfKey]) {
    books[shelfKey] = { label: `🏷️ #${tags[0]}${tags.length > 1 ? '...' : ''}`, type: 'tags' };
    localStorage.setItem("nostr_shelf", JSON.stringify(books));
    if (typeof renderShelf === 'function') renderShelf();
  }

  const newUrl = `${window.location.pathname}?t=${encodeURIComponent(tagQueryString)}`;
  window.history.pushState({path: newUrl}, '', newUrl);
  collectedNotesByAuthor.clear();
  currentLoadedTagsSet.clear();
  tags.forEach(t => currentLoadedTagsSet.add(t));

  if (resultsDiv) resultsDiv.innerHTML = "";
  if (tagCloudFooter) tagCloudFooter.classList.add("hidden");

  fetchNostrTags(tags);
  if (searchBar) searchBar.value = "";
}

window.closeLibrary = function() {
  if (library) library.style.display = "none";
  const cleanUrl = window.location.pathname;
  window.history.pushState({path: cleanUrl}, '', cleanUrl);
}

const dismissedNotes = getDismissedNotes();
function getDismissedNotes() {
  return new Set(JSON.parse(localStorage.getItem("baita_dismissed") || "[]"));
}

window.dismissNote = function(eventId) { 
  let dismissed = JSON.parse(localStorage.getItem("baita_dismissed") || "[]");
  if (!dismissed.includes(eventId)) {
    dismissed.push(eventId);
    if (dismissed.length > 50) dismissed.shift();
    localStorage.setItem("baita_dismissed", JSON.stringify(dismissed));
  }
  const card = document.getElementById(`note-${eventId}`);
  if (card) card.remove();
}

function renderNoteCard(ev) {
  if (loadingDiv) loadingDiv.classList.add("hidden");
  
  if (!collectedNotesByAuthor.has(ev.pubkey)) {
    collectedNotesByAuthor.set(ev.pubkey, []);
  }
  let authorNotes = collectedNotesByAuthor.get(ev.pubkey);
  if (!authorNotes.some(n => n.id === ev.id)) {
    authorNotes.push(ev);
    authorNotes.sort((a, b) => b.created_at - a.created_at);
  }

  updateAuthorCardsUI();
  updateTagCloudFooter();
}

function updateAuthorCardsUI() {
  if (!resultsDiv) return;
  resultsDiv.innerHTML = "";

  collectedNotesByAuthor.forEach((notesArray, pubkey) => {
    let npub = nip19.npubEncode(pubkey);
    let shortNpub = npub.substring(0, 10) + '...' + npub.substring(npub.length - 4);
    
    let meta = authorMetadataCache.get(pubkey) || { name: shortNpub, picture: '' };
    let displayName = meta.name || shortNpub;
    let avatarHtml = meta.picture 
      ? `<img src="${meta.picture}" class="w-10 h-10 rounded-full object-cover border border-slate-700" onerror="this.style.display='none'">`
      : `<div class="w-10 h-10 rounded-full bg-indigo-600/30 border border-indigo-500/30 flex items-center justify-center text-indigo-300 font-bold text-sm">${displayName.substring(0,2).toUpperCase()}</div>`;

    const latestNotes = notesArray.slice(0, 3);

    let notesHtml = latestNotes.map(ev => {
      const formattedContent = parseNostrContent(ev.content);
      let nevent = nip19.neventEncode({ id: ev.id });
      let noteLink = `Tagnote.html?nevent=${nevent}`;

      return `
        <div id="note-${ev.id}" class="note-card p-3.5 rounded-xl flex flex-col justify-between">
          <div class="whitespace-pre-wrap leading-relaxed break-words text-xs text-slate-200 mb-3">${formattedContent}</div>
          <div class="flex justify-between items-center text-[11px] text-slate-400 border-t border-slate-800/80 pt-2">
            <span>${new Date(ev.created_at * 1000).toLocaleDateString()}</span>
            <div class="flex items-center gap-3">
              <a href="${noteLink}" target="_blank" class="hover:text-indigo-400 font-medium text-indigo-300 transition-colors">Open note ↗</a>
              <button type="button" onclick="dismissNote('${ev.id}')" title="Nascondi nota" class="text-slate-500 hover:text-red-400 bg-transparent border-none cursor-pointer">✕</button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    const authorCard = document.createElement("div");
    authorCard.className = "pt-6 first:pt-0 border-t border-slate-800/80 first:border-t-0";
    let pubkeySection = SHOW_PUBKEY ? `<span class="text-[11px] text-slate-500 font-mono">${shortNpub}</span>` : '';

    authorCard.innerHTML = `
      <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-4 sm:p-5 shadow-sm">
        <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800/60">
          <div class="flex items-center gap-3">
            ${avatarHtml}
            <div>
              <div class="font-bold text-sm text-white flex items-center gap-2">
                <a href="profile.html?npub=${npub}" target="_blank" class="hover:text-indigo-400 transition-colors">${displayName}</a>
              </div>
              ${pubkeySection}
            </div>
          </div>
          <span class="text-xs font-medium text-slate-400 bg-slate-800/70 px-2.5 py-1 rounded-lg border border-slate-700/40">
            ${notesArray.length} ${notesArray.length === 1 ? 'nota' : 'note'}
          </span>
        </div>
        <div class="space-y-3">
          ${notesHtml}
        </div>
      </div>
    `;

    resultsDiv.appendChild(authorCard);
  });
}

function updateTagCloudFooter() {
  if (!tagCloudContainer || !tagCloudFooter) return;
  if (currentLoadedTagsSet.size === 0) {
    tagCloudFooter.classList.add("hidden");
    return;
  }

  tagCloudContainer.innerHTML = Array.from(currentLoadedTagsSet)
    .sort()
    .map(tag => `<a href="readtag.html?t=${tag}" onclick="event.preventDefault(); executeTagReader('${tag}');" class="text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700/50 transition-all">#${tag}</a>`)
    .join('');

  tagCloudFooter.classList.remove("hidden");
}

function fetchAuthorMetadata(pubkeysArray, Relays) {
  Relays.forEach(relayUrl => {
    let ws;
    try {
      ws = new WebSocket(relayUrl);
    } catch(e) { return; }

    ws.onopen = () => {
      ws.send(JSON.stringify(["REQ", "baita_metadata", { kinds: [0], authors: pubkeysArray }]));
    };
    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data[0] === "EVENT") {
          const ev = data[2];
          try {
            const profile = JSON.parse(ev.content);
            authorMetadataCache.set(ev.pubkey, {
              name: profile.display_name || profile.name || '',
              picture: profile.picture || ''
            });
            updateAuthorCardsUI();
          } catch(err) {}
        } else if (data[0] === "EOSE") {
          ws.close();
        }
      } catch(err) {}
    };
  });
}

function fetchNostrTags(tagsArray) {
  if (loadingDiv) {
    loadingDiv.textContent = `⏳ Reading notes for #${tagsArray.join(", #")}...`;
    loadingDiv.classList.remove("hidden");
  }
  
  const Relays = [
    "wss://relay.damus.io",  
    "wss://relay.primal.net",
    "wss://relay.ditto.pub/"
  ];

  let seenEventIds = new Set();
  let activeConnections = Relays.length;
  let collectedPubkeys = new Set();

  Relays.forEach(relayUrl => {
    let ws;
    try {
      ws = new WebSocket(relayUrl);
    } catch (e) {
      checkFinished();
      return;
    }

    ws.onopen = () => {
      let filter = { kinds: [1], "#t": tagsArray, limit: 60 };
      ws.send(JSON.stringify(["REQ", "baita_tag_reader", filter]));
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data[0] === "EVENT") {
          const ev = data[2];
          
          if (ev.kind === 1984) return;

          if (!seenEventIds.has(ev.id) && !dismissedNotes.has(ev.id)) {
            seenEventIds.add(ev.id);
            collectedPubkeys.add(ev.pubkey);
            renderNoteCard(ev);
          }
        } else if (data[0] === "EOSE") {
          ws.close();
        }
      } catch (err) {}
    };

    ws.onerror = () => checkFinished();
    ws.onclose = () => {
      checkFinished();
      if (collectedPubkeys.size > 0) {
        fetchAuthorMetadata(Array.from(collectedPubkeys), Relays);
      }
    };
  });

  function checkFinished() {
    activeConnections--;
    if (activeConnections <= 0) {
      if (loadingDiv) loadingDiv.classList.add("hidden");
      if (resultsDiv && resultsDiv.children.length === 0) {
        if (loadingDiv) {
          loadingDiv.textContent = `No notes found for tags: #${tagsArray.join(", #")}.`;
          loadingDiv.classList.remove("hidden");
        }
      }
    }
  }
}

document.addEventListener("DOMContentLoaded", () => {
  const urlParams = new URLSearchParams(window.location.search);
  const tagParam = urlParams.get('t'); 
  
  if (tagParam) {
    executeTagReader(tagParam);
  }

  if (searchButton) {
    searchButton.onclick = () => {
      const term = searchBar.value.trim();
      if (term) executeTagReader(term);
    };
  }

  if (searchBar) {
    searchBar.addEventListener("keydown", (e) => {
      e.key === "Enter" && (term => term && executeTagReader(term))(searchBar.value.trim());
    });
  }
});
</script>

</body>
</html>
