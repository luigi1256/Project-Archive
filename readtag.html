<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tag Reader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="mac.css">
<link rel="stylesheet" href="readtag.css">
</head>
<body>

<button id="toggleShelf" onclick="toggleShelf()">📚 Shelf</button>

<aside id="shelf" class="collapsed">
    <h2>My saved tags</h2>
    <div id="books"></div>
</aside>

<div id="main">
                                                                                                                                                                                                                                                                                          
    <div style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 0.75rem;">Tag Reader</h1>                                                                                                                                                                                                                                                                                
        <div style="display: flex; align-items: center; justify-content: center; gap: 0.6rem;">                                                                                                                                                          
          <a href="Search.html" target="_blank" style="padding: 6px 14px; background: rgba(255,255,255,0.05); border-radius: 8px; font-size: 13px; border: 1px solid var(--nostur-card-border);">Search</a>  
          <a href="index.html" style="padding: 6px 14px; background: rgba(255,255,255,0.05); border-radius: 8px; font-size: 13px; border: 1px solid var(--nostur-card-border);">🏠 Home</a>
        </div>
    </div>                                                                                                                                                                                                                                                                                                                                          
              
  <div id="searchArea">
    <form id="searchForm" onsubmit="event.preventDefault();" style="width: 100%; display: flex; justify-content: center;">
      <div id="searchContainer">
        <input
          id="searchBar"
          type="text"
          placeholder="Enter tags, e.g. food, art, asknostr..."
          aria-label="Search tags"
        >
        <button id="searchButton" type="submit">🏷️ Read</button>
      </div>
    </form>
  </div>

<div style="margin: 1rem 0 2rem 0; text-align: center;">
  <p style="font-size: 11px; color: var(--nostur-text-muted); margin: 0;">
    Tip: Query multiple tags using commas (e.g. <code style="background: rgba(10,10,12,0.8); padding: 2px 6px; border-radius: 4px; color: var(--nostur-accent-purple);">food, recipe</code>)
  </p>
</div>  

  <div id="library" style="display: none;">
    <div style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--nostur-card-border); padding-bottom: 0.75rem; gap: 1rem;">
      <div>
        <span id="libraryTitle" style="font-size: 11px; font-weight: 600; color: var(--nostur-accent-purple); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 2px;"></span>
        <span id="activeLayoutBadge" style="font-size: 10px; background: rgba(192,132,252,0.1); color: var(--nostur-accent-purple); border: 1px solid rgba(192,132,252,0.2); padding: 1px 6px; border-radius: 4px; font-family: monospace;">Layout: Auto</span>
      </div>
      
      <div style="display: flex; align-items: center; gap: 8px;">
        <!-- Layout Switcher Buttons -->
        <div style="display: flex; background: rgba(10,10,12,0.6); padding: 3px; border-radius: 8px; border: 1px solid var(--nostur-card-border); font-size: 11px; gap: 3px;">
          <button onclick="switchLayout('auto')" style="padding: 4px 8px; border: none; background: transparent;">✨ Auto</button>
          <button onclick="switchLayout('grid')" style="padding: 4px 8px; border: none; background: transparent;">🖼️ Grid</button>
          <button onclick="switchLayout('links')" style="padding: 4px 8px; border: none; background: transparent;">🔗 Links</button>
          <button onclick="switchLayout('feed')" style="padding: 4px 8px; border: none; background: transparent;">👤 Feed</button>
        </div>

        <button onclick="closeLibrary()" style="font-size: 11px; padding: 5px 10px;">✖ Close</button>
      </div>
    </div>

    <div id="loading" class="search-loading hidden" style="margin: 0 auto 1rem auto; width: auto;">
      ⏳ Loading tags...
    </div>
       
    <!-- Results Container (gestito via JS con le classi del CSS) -->
    <div id="results"></div>

    <div id="tagCloudFooter" style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--nostur-card-border); display: none;">
      <div style="font-size: 11px; color: var(--nostur-text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 500;">🏷️ Related Tags & Categories</div>
      <div id="tagCloudContainer" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
    </div>
  </div>
</div>

<script src="baita_core.js"></script>
<script type="module">
import { nip19 } from 'https://cdn.jsdelivr.net/npm/nostr-tools/+esm'  

const searchBar = document.getElementById("searchBar");
const searchButton = document.getElementById("searchButton");
const library = document.getElementById("library");
const resultsDiv = document.getElementById("results");
const loadingDiv = document.getElementById("loading");
const libraryTitle = document.getElementById("libraryTitle");
const tagCloudFooter = document.getElementById("tagCloudFooter");
const tagCloudContainer = document.getElementById("tagCloudContainer");
const activeLayoutBadge = document.getElementById("activeLayoutBadge");
const shelf = document.getElementById("shelf");

let allCollectedEvents = [];
let collectedNotesByAuthor = new Map();
let currentLoadedTagsSet = new Set();
let authorMetadataCache = new Map();
let currentActiveTags = [];
let forcedLayoutMode = 'auto'; 

const SHOW_PUBKEY = false; 

window.toggleShelf = function() {
  if (shelf) shelf.classList.toggle("collapsed");
}

function parseNostrContent(content) {
    if (!content) return '';
  
    let parsed = content.replace(/nostr:(note1[0-9a-z]+|nevent1[0-9a-z]+|npub1[0-9a-z]+|nprofile1[0-9a-z]+|naddr1[0-9a-z]+)/gi, (match, entity) => {
        let url = '#';
        let label = entity.substring(0, 10) + '...';
        if (entity.startsWith('npub') || entity.startsWith('nprofile')) {
            label = '👤 ' + label;
            url = `profile.html?npub=${entity}`;
        } else if (entity.startsWith('note') || entity.startsWith('nevent')) {
            label = '💬 ' + label;
            url = `Tagnote.html?nevent=${entity}`;                
        } else if (entity.startsWith('naddr')) {
            label = '📚 ' + label;
            url = `modfile.html?naddr=${entity}`;
        }
        return `<a href="${url}" target="_blank" class="nostr-entity-badge">${label}</a>`;
    });

    const hashtagRegex = /(^|\s)#([a-zA-Z0-9_]+)/g;
    parsed = parsed.replace(hashtagRegex, (match, space, tag) => {
        currentLoadedTagsSet.add(tag.toLowerCase());
        return `${space}<a href="readtag.html?t=${tag}" target="_blank" class="nostr-hashtag">#${tag}</a>`;
    });

    const urlRegex = /(https?:\/\/[^\s]+)/g;
    parsed = parsed.replace(urlRegex, (url) => {
        let cleanUrl = url.replace(/[.,!?)]$/, '');
        let trailing = url.slice(cleanUrl.length);
        
        if (cleanUrl.includes('njump.to') || cleanUrl.includes('njump.me')) return url;
        let lower = cleanUrl.toLowerCase();
        
        let typeBadge = "🔗";
        if (lower.match(/\.(jpeg|jpg|gif|png|webp|svg)(\?.*)?$/i) || lower.includes('image') || lower.includes('imgur') || lower.includes('primal.net/media')) {
            typeBadge = "🖼️";
        } else if (lower.match(/\.(mp4|webm|mov|ogg)(\?.*)?$/i) || lower.includes('youtube.com') || lower.includes('youtu.be')) {
            typeBadge = "🎬";
        }
        let displayUrl = cleanUrl.replace(/^https?:\/\/(www\.)?/, '');
        if (displayUrl.length > 25) displayUrl = displayUrl.substring(0, 22) + '...';
        
        return `<a href="${cleanUrl}" target="_blank" class="nostr-link-badge"><span>${typeBadge}</span> ${displayUrl}</a>${trailing}`;
    });

    return parsed;
}

function determineBestLayout(tags, events) {
    if (forcedLayoutMode !== 'auto') return forcedLayoutMode;

    const mediaKeywords = ['food', 'art', 'photo', 'photography', 'meme', 'nature', 'travel', 'fashion', 'lunch', 'recipe'];
    const linkKeywords = ['link', 'news', 'blog', 'article', 'science', 'bitcoin', 'nostr', 'dev', 'code'];

    const hasMediaKeyword = tags.some(t => mediaKeywords.includes(t));
    const hasLinkKeyword = tags.some(t => linkKeywords.includes(t));

    let imageCount = 0;
    let linkCount = 0;
    
    events.forEach(ev => {
        if (ev.content.match(/https?:\/\/[^\s]+\.(jpeg|jpg|gif|png|webp)/i) || ev.content.includes('primal.net/media')) {
            imageCount++;
        }
        if (ev.content.match(/https?:\/\/[^\s]+/g) && !ev.content.match(/\.(jpeg|jpg|gif|png|webp)/i)) {
            linkCount++;
        }
    });

    if (hasMediaKeyword || imageCount > events.length * 0.25) {
        return 'grid'; 
    } else if (hasLinkKeyword || linkCount > events.length * 0.4) {
        return 'links'; 
    }

    return 'feed'; 
}

window.switchLayout = function(mode) {
    forcedLayoutMode = mode;
    activeLayoutBadge.textContent = `Layout: ${mode.toUpperCase()} ${forcedLayoutMode === 'auto' ? '(Auto)' : '(Custom)'}`;
    renderCurrentLayout();
}

function executeTagReader(rawInput) {
  if (!rawInput) return;
  
  let tags = rawInput
    .split(/[\s,]+/)
    .map(t => t.replace(/^#/, "").trim().toLowerCase())
    .filter(t => t.length > 0);

  if (tags.length === 0) return;

  currentActiveTags = tags;
  tags.forEach(t => currentLoadedTagsSet.add(t));
  const tagQueryString = tags.join(",");

  if (library) library.style.display = "block";
  if (libraryTitle) libraryTitle.textContent = `Tags: #${tags.join(" #")}`;

  let books = JSON.parse(localStorage.getItem("nostr_shelf")) || {};
  let shelfKey = `#${tagQueryString}`;
  if (!books[shelfKey]) {
    books[shelfKey] = { label: `🏷️ #${tags[0]}${tags.length > 1 ? '...' : ''}`, type: 'tags' };
    localStorage.setItem("nostr_shelf", JSON.stringify(books));
    if (typeof renderShelf === 'function') renderShelf();
  }

  const newUrl = `${window.location.pathname}?t=${encodeURIComponent(tagQueryString)}`;
  window.history.pushState({path: newUrl}, '', newUrl);
  
  allCollectedEvents = [];
  collectedNotesByAuthor.clear();
  currentLoadedTagsSet.clear();
  tags.forEach(t => currentLoadedTagsSet.add(t));
  forcedLayoutMode = 'auto';

  if (resultsDiv) resultsDiv.innerHTML = "";
  if (tagCloudFooter) tagCloudFooter.style.display = "none";

  fetchNostrTags(tags);
  if (searchBar) searchBar.value = "";
}

window.closeLibrary = function() {
  if (library) library.style.display = "none";
  const cleanUrl = window.location.pathname;
  window.history.pushState({path: cleanUrl}, '', cleanUrl);
}

const dismissedNotes = getDismissedNotes();
function getDismissedNotes() {
  return new Set(JSON.parse(localStorage.getItem("baita_dismissed") || "[]"));
}

window.dismissNote = function(eventId) { 
  let dismissed = JSON.parse(localStorage.getItem("baita_dismissed") || "[]");
  if (!dismissed.includes(eventId)) {
    dismissed.push(eventId);
    if (dismissed.length > 50) dismissed.shift();
    localStorage.setItem("baita_dismissed", JSON.stringify(dismissed));
  }
  allCollectedEvents = allCollectedEvents.filter(n => n.id !== eventId);
  collectedNotesByAuthor.forEach((notes, pubkey) => {
    collectedNotesByAuthor.set(pubkey, notes.filter(n => n.id !== eventId));
  });
  renderCurrentLayout();
}

function handleNewNote(ev) {
  if (loadingDiv) loadingDiv.classList.add("hidden");
  
  if (!allCollectedEvents.some(n => n.id === ev.id)) {
    allCollectedEvents.push(ev);
    allCollectedEvents.sort((a, b) => b.created_at - a.created_at);
  }

  if (!collectedNotesByAuthor.has(ev.pubkey)) {
    collectedNotesByAuthor.set(ev.pubkey, []);
  }
  let authorNotes = collectedNotesByAuthor.get(ev.pubkey);
  if (!authorNotes.some(n => n.id === ev.id)) {
    authorNotes.push(ev);
    authorNotes.sort((a, b) => b.created_at - a.created_at);
  }

  renderCurrentLayout();
  updateTagCloudFooter();
}

function renderCurrentLayout() {
    const layout = determineBestLayout(currentActiveTags, allCollectedEvents);
    activeLayoutBadge.textContent = `Layout: ${layout.toUpperCase()} ${forcedLayoutMode === 'auto' ? '(Auto)' : '(Custom)'}`;
    resultsDiv.className = "";

    if (layout === 'grid') {
        renderImageGridLayout();
    } else if (layout === 'links') {
        renderLinksCardsLayout();
    } else {
        renderAuthorFeedLayout();
    }
}

function renderImageGridLayout() {
    if (!resultsDiv) return;
    resultsDiv.style.display = "grid";
    resultsDiv.style.gridTemplateColumns = "repeat(auto-fill, minmax(260px, 1fr))";
    resultsDiv.style.gap = "1rem";
    
    resultsDiv.innerHTML = allCollectedEvents.map(ev => {
        const formattedContent = parseNostrContent(ev.content);
        let nevent = nip19.neventEncode({ id: ev.id });
        let meta = authorMetadataCache.get(ev.pubkey) || { name: 'Anon', picture: '' };
        
        let imgMatch = ev.content.match(/(https?:\/\/[^\s]+\.(jpeg|jpg|gif|png|webp)(\?.*)?)/i) || ev.content.match(/(https?:\/\/[^\s]*primal\.net\/media[^\s]*)/i);
        let imgHtml = imgMatch ? `<div style="margin-bottom: 10px; overflow: hidden; border-radius: 8px; height: 160px; background: #000;"><img src="${imgMatch[0]}" style="width: 100%; height: 100%; object-fit: cover;" loading="lazy"></div>` : '';

        return `
        <div id="note-${ev.id}" class="reddit-card">
            <div>
                ${imgHtml}
                <div style="font-size: 12px; color: var(--nostur-text); line-height: 1.4; margin-bottom: 10px; word-break: break-word;">${formattedContent}</div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--nostur-text-muted); border-top: 1px solid var(--nostur-card-border); padding-top: 8px;">
                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px;">👤 ${meta.name}</span>
                <div style="display: flex; gap: 8px;">
                    <a href="Tagnote.html?nevent=${nevent}" target="_blank" style="color: var(--nostur-accent-purple);">View ↗</a>
                    <button onclick="dismissNote('${ev.id}')" style="background: transparent; border: none; color: var(--nostur-text-muted); cursor: pointer; padding: 0;">✕</button>
                </div>
            </div>
        </div>`;
    }).join('');
}

function renderLinksCardsLayout() {
    if (!resultsDiv) return;
    resultsDiv.style.display = "flex";
    resultsDiv.style.flexDirection = "column";
    resultsDiv.style.gap = "10px";

    resultsDiv.innerHTML = allCollectedEvents.map(ev => {
        const formattedContent = parseNostrContent(ev.content);
        let nevent = nip19.neventEncode({ id: ev.id });
        let meta = authorMetadataCache.get(ev.pubkey) || { name: 'Anon', picture: '' };
        
        return `
        <div id="note-${ev.id}" class="reddit-card" style="flex-direction: row; justify-content: space-between; align-items: center; gap: 15px;">
            <div style="flex: 1;">
                <div style="font-size: 12px; color: var(--nostur-text); margin-bottom: 6px;">${formattedContent}</div>
                <div style="font-size: 11px; color: var(--nostur-text-muted); display: flex; gap: 8px;">
                    <span>By <strong style="color: var(--nostur-text);">${meta.name}</strong></span>
                    <span>•</span>
                    <span>${new Date(ev.created_at * 1000).toLocaleDateString()}</span>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <a href="Tagnote.html?nevent=${nevent}" target="_blank" class="publish" style="padding: 6px 12px; font-size: 11px; text-decoration: none;">Open ↗</a>
                <button onclick="dismissNote('${ev.id}')" style="background: transparent; border: none; color: var(--nostur-text-muted); cursor: pointer;">✕</button>
            </div>
        </div>`;
    }).join('');
}

function renderAuthorFeedLayout() {
  if (!resultsDiv) return;
  resultsDiv.style.display = "grid";
  resultsDiv.style.gridTemplateColumns = "repeat(auto-fill, minmax(300px, 1fr))";
  resultsDiv.style.gap = "16px";
  resultsDiv.innerHTML = "";

  collectedNotesByAuthor.forEach((notesArray, pubkey) => {
    let npub = nip19.npubEncode(pubkey);
    let shortNpub = npub.substring(0, 10) + '...' + npub.substring(npub.length - 4);
    
    let meta = authorMetadataCache.get(pubkey) || { name: shortNpub, picture: '' };
    let displayName = meta.name || shortNpub;

    const latestNotes = notesArray.slice(0, 5);

    let notesHtml = latestNotes.map(ev => {
      const formattedContent = parseNostrContent(ev.content);
      let nevent = nip19.neventEncode({ id: ev.id });
      let noteLink = `Tagnote.html?nevent=${nevent}`;

      return `
        <div id="note-${ev.id}" class="mini-note-card">
          <div style="margin-bottom: 8px; line-height: 1.4;">${formattedContent}</div>
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--nostur-text-muted); border-top: 1px solid rgba(255,255,255,0.05); padding-top: 6px;">
            <span>${new Date(ev.created_at * 1000).toLocaleDateString()}</span>
            <div style="display: flex; gap: 8px;">
              <a href="${noteLink}" target="_blank" style="color: var(--nostur-accent-purple);">Open ↗</a>
              <button type="button" onclick="dismissNote('${ev.id}')" style="background: transparent; border: none; color: var(--nostur-text-muted); cursor: pointer; padding: 0;">✕</button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    const authorCard = document.createElement("div");
    authorCard.className = "author-column-card";

    authorCard.innerHTML = `
      <div class="author-header">
        <a href="profile.html?npub=${npub}" target="_blank" style="color: var(--nostur-accent-purple); text-decoration: none; font-weight: bold;">${displayName}</a>
        <span style="background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 4px; font-size: 10px; color: var(--nostur-text-muted);">${notesArray.length}</span>
      </div>
      <div class="author-notes-container">
        ${notesHtml}
      </div>
    `;

    resultsDiv.appendChild(authorCard);
  });
}

function updateTagCloudFooter() {
  if (!tagCloudContainer || !tagCloudFooter) return;
  if (currentLoadedTagsSet.size === 0) {
    tagCloudFooter.style.display = "none";
    return;
  }

  tagCloudContainer.innerHTML = Array.from(currentLoadedTagsSet)
    .sort()
    .map(tag => `<a href="readtag.html?t=${tag}" onclick="event.preventDefault(); executeTagReader('${tag}');" style="font-size: 11px; background: rgba(255,255,255,0.04); color: var(--nostur-text); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--nostur-card-border); text-decoration: none;">#${tag}</a>`)
    .join('');

  tagCloudFooter.style.display = "block";
}

function fetchAuthorMetadata(pubkeysArray, Relays) {
  Relays.forEach(relayUrl => {
    let ws;
    try {
      ws = new WebSocket(relayUrl);
    } catch(e) { return; }

    ws.onopen = () => {
      ws.send(JSON.stringify(["REQ", "baita_metadata", { kinds: [0], authors: pubkeysArray }]));
    };
    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data[0] === "EVENT") {
          const ev = data[2];
          try {
            const profile = JSON.parse(ev.content);
            authorMetadataCache.set(ev.pubkey, {
              name: profile.display_name || profile.name || '',
              picture: profile.picture || ''
            });
            renderCurrentLayout();
          } catch(err) {}
        } else if (data[0] === "EOSE") {
          ws.close();
        }
      } catch(err) {}
    };
  });
}

function fetchNostrTags(tagsArray) {
  if (loadingDiv) {
    loadingDiv.textContent = `⏳ Reading notes for #${tagsArray.join(", #")}...`;
    loadingDiv.classList.remove("hidden");
  }
  
  const Relays = [
    "wss://relay.damus.io",  
    "wss://relay.primal.net",
    "wss://relay.ditto.pub/"
  ];

  let seenEventIds = new Set();
  let activeConnections = Relays.length;
  let collectedPubkeys = new Set();

  Relays.forEach(relayUrl => {
    let ws;
    try {
      ws = new WebSocket(relayUrl);
    } catch (e) {
      checkFinished();
      return;
    }

    ws.onopen = () => {
      let filter = { kinds: [1], "#t": tagsArray, limit: 60 };
      ws.send(JSON.stringify(["REQ", "baita_tag_reader", filter]));
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data[0] === "EVENT") {
          const ev = data[2];
          
          if (ev.kind === 1984) return;

          if (!seenEventIds.has(ev.id) && !dismissedNotes.has(ev.id)) {
            seenEventIds.add(ev.id);
            collectedPubkeys.add(ev.pubkey);
            handleNewNote(ev);
          }
        } else if (data[0] === "EOSE") {
          ws.close();
        }
      } catch (err) {}
    };

    ws.onerror = () => checkFinished();
    ws.onclose = () => {
      checkFinished();
      if (collectedPubkeys.size > 0) {
        fetchAuthorMetadata(Array.from(collectedPubkeys), Relays);
      }
    };
  });

  function checkFinished() {
    activeConnections--;
    if (activeConnections <= 0) {
      if (loadingDiv) loadingDiv.classList.add("hidden");
      if (resultsDiv && allCollectedEvents.length === 0) {
        if (loadingDiv) {
          loadingDiv.textContent = `No notes found for tags: #${tagsArray.join(", #")}.`;
          loadingDiv.classList.remove("hidden");
        }
      }
    }
  }
}

document.addEventListener("DOMContentLoaded", () => {
  const urlParams = new URLSearchParams(window.location.search);
  const tagParam = urlParams.get('t'); 
  
  if (tagParam) {
    executeTagReader(tagParam);
  }

  if (searchButton) {
    searchButton.onclick = () => {
      const term = searchBar.value.trim();
      if (term) executeTagReader(term);
    };
  }

  if (searchBar) {
    searchBar.addEventListener("keydown", (e) => {
      e.key === "Enter" && (term => term && executeTagReader(term))(searchBar.value.trim());
    });
  }
});
</script>

</body>
</html>
