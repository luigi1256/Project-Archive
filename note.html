<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note View</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans antialiased overflow-x-hidden">

    <header class="max-w-3xl mx-auto pt-8 pb-4 px-3 sm:px-4 flex justify-between items-center border-b border-gray-800 mb-6">
        <h1 class="text-xl sm:text-2xl font-bold text-purple-400">Thread & Media Note</h1>
        <a href="resource_hub.html" class="px-3 py-1.5 bg-gray-800 text-gray-300 rounded-lg text-xs sm:text-sm font-medium hover:bg-gray-700 transition">← Back to resource</a>
    </header>

    <main class="max-w-3xl mx-auto px-3 sm:px-4 pb-24">
        <div id="loading" class="text-center text-gray-400 text-base sm:text-lg py-12">Loading notes and thread...</div>
        <div id="mainNoteContainer" class="hidden mb-6 sm:mb-8">
            <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 sm:mb-3">Main Note</h3>
            <div id="mainNoteCard" class="bg-gray-900 border-2 border-purple-500/50 p-4 sm:p-6 rounded-2xl shadow-xl overflow-hidden"></div>
        </div>

        <div id="tabsContainer" class="hidden flex border-b border-gray-800 mb-6 overflow-x-auto scrollbar-none">
            <button id="tabReplies" onclick="switchTab('replies')" class="px-4 sm:px-6 py-3 text-xs sm:text-sm font-semibold text-purple-400 border-b-2 border-purple-400 focus:outline-none transition whitespace-nowrap cursor-pointer">
                Thread & Answer (<span id="replyCountTab">0</span>)
            </button>
            <button id="tabQuotes" onclick="switchTab('quotes')" class="px-4 sm:px-6 py-3 text-xs sm:text-sm font-semibold text-gray-400 hover:text-gray-200 border-b-2 border-transparent focus:outline-none transition whitespace-nowrap cursor-pointer">
                Quotes and Mentions (<span id="quoteCountTab">0</span>)
            </button>
        </div>

        <div id="repliesContainer" class="hidden space-y-3 sm:space-y-4">
            <div id="repliesList" class="space-y-3 sm:space-y-4"></div>
        </div>

        <div id="quotesContainer" class="hidden space-y-3 sm:space-y-4">
            <div id="quotesList" class="space-y-3 sm:space-y-4"></div>
        </div>
    </main>
    <script src="cache.js"></script>
    <script type="module">
        import { SimplePool, nip19 } from 'https://cdn.jsdelivr.net/npm/nostr-tools/+esm'

        const INITIAL_RELAYS = [
            'wss://relay.damus.io',
            'wss://nos.lol',
            'wss://nostr.stakey.net',
            'wss://relay.ditto.pub'
        ];

        const PROFILE_RELAYS = ["wss://purplepag.es/", ...INITIAL_RELAYS];
        const profilesCache = new Map();
        const pool = new SimplePool();

        window.switchTab = function(tabName) {
            const repliesDiv = document.getElementById('repliesContainer');
            const quotesDiv = document.getElementById('quotesContainer');
            const tabReplies = document.getElementById('tabReplies');
            const tabQuotes = document.getElementById('tabQuotes');

            if (tabName === 'replies') {
                repliesDiv.classList.remove('hidden');
                quotesDiv.classList.add('hidden');
                tabReplies.className = "px-4 sm:px-6 py-3 text-xs sm:text-sm font-semibold text-purple-400 border-b-2 border-purple-400 focus:outline-none transition whitespace-nowrap cursor-pointer";
                tabQuotes.className = "px-4 sm:px-6 py-3 text-xs sm:text-sm font-semibold text-gray-400 hover:text-gray-200 border-b-2 border-transparent focus:outline-none transition whitespace-nowrap cursor-pointer";
            } else {
                quotesDiv.classList.remove('hidden');
                repliesDiv.classList.add('hidden');
                tabQuotes.className = "px-4 sm:px-6 py-3 text-xs sm:text-sm font-semibold text-purple-400 border-b-2 border-purple-400 focus:outline-none transition whitespace-nowrap cursor-pointer";
                tabReplies.className = "px-4 sm:px-6 py-3 text-xs sm:text-sm font-semibold text-gray-400 hover:text-gray-200 border-b-2 border-transparent focus:outline-none transition whitespace-nowrap cursor-pointer";
            }
        }

        async function preloadProfiles(pubkeys) {
            const uniquePubkeys = [...new Set(pubkeys)];
            const missing = uniquePubkeys.filter(pk => !profilesCache.has(pk));
            if (missing.length === 0) return;
            try {
                const events = await pool.querySync(PROFILE_RELAYS, {
                    kinds: [0],
                    authors: missing
                });
                events.forEach(ev => {
                    try {
                        const profileData = JSON.parse(ev.content);
                        profilesCache.set(ev.pubkey, profileData);
                        if (typeof setProfileCache === 'function') setProfileCache(ev.pubkey, profileData);
                    } catch(e) {}
                });
            } catch(e) {
                console.error("Errore preload profili:", e);
            }
        }

        async function initThread() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const idParam = urlParams.get('id');
                const neventParam = urlParams.get('nevent');
                const noteParam = urlParams.get('note');

                let targetId = null;
                let queryRelays = INITIAL_RELAYS;

                if (neventParam) {
                    const decoded = nip19.decode(neventParam);
                    if (decoded.type === 'nevent') {
                        targetId = decoded.data.id;
                        if (decoded.data.relays && decoded.data.relays.length > 0) {
                            queryRelays = [...decoded.data.relays, ...INITIAL_RELAYS];
                        }
                    }
                } else if (noteParam) {
                    const decoded = nip19.decode(noteParam);
                    if (decoded.type === 'note') {
                        targetId = decoded.data;
                    }
                } else if (idParam) {
                    if (idParam.startsWith('note1')) {
                        const decoded = nip19.decode(idParam);
                        if (decoded.type === 'note') targetId = decoded.data;
                    } else if (idParam.startsWith('nevent1')) {
                        const decoded = nip19.decode(idParam);
                        if (decoded.type === 'nevent') {
                            targetId = decoded.data.id;
                            if (decoded.data.relays) queryRelays = [...decoded.data.relays, ...INITIAL_RELAYS];
                        }
                    } else {
                        targetId = idParam;
                    }
                }

                if (!targetId) {
                    document.getElementById('loading').innerText = "No ID, nevent, or note specified in the URL.";
                    return;
                }

                const mainEvents = await pool.querySync(queryRelays, { ids: [targetId] });
                if (mainEvents.length === 0) {
                    document.getElementById('loading').innerText = "Main note not found on relays.";
                    return;
                }

                const mainEvent = mainEvents[0];

                const relatedEvents = await pool.querySync(queryRelays, {
                    kinds: [1, 1111, 20, 22, 34236, 54, 1244],
                    '#e': [targetId]
                });

                function classifyEvent(ev, rootId) {
                    const eTags = ev.tags.filter(t => t[0] === 'e' || t[0] === 'E');
                    const qTags = ev.tags.filter(t => t[0] === 'q' || t[0] === 'Q');

                    const isExplicitQuote = qTags.some(t => t[1] === rootId) || eTags.some(t => t[1] === rootId && t[3] === 'mention');
                    if (isExplicitQuote) return 'quote';
                    const targetsRoot = eTags.some(t => t[1] === rootId);
                    if (targetsRoot || ev.tags.some(t => (t[0] === 'E' || t[3] === 'root') && t[1] === rootId)) {
                        return 'reply'; 
                    }
                    if (eTags.some(t => t[1] === rootId)) return 'reply';
                    return 'other';
                }

                let directRepliesEvents = [];
                let quoteEvents = [];

                relatedEvents.forEach(ev => {
                    const type = classifyEvent(ev, targetId);
                    if (type === 'quote') {
                        quoteEvents.push(ev);
                    } else if (type === 'reply') {
                        directRepliesEvents.push(ev);
                    }
                });

                let allThreadEventsMap = new Map();
                allThreadEventsMap.set(targetId, mainEvent);
                directRepliesEvents.forEach(ev => allThreadEventsMap.set(ev.id, ev));

                let currentParentIds = directRepliesEvents.map(ev => ev.id);
                for (let depth = 0; depth < 3; depth++) {
                    if (currentParentIds.length === 0) break;
                    const fetched = await pool.querySync(queryRelays, {
                        kinds: [1, 1111, 20, 22, 34236, 54, 1244],
                        '#e': currentParentIds
                    });

                    let newParentIds = [];
                    fetched.forEach(ev => {
                        if (!allThreadEventsMap.has(ev.id)) {
                            const classification = classifyEvent(ev, targetId);
                            if (classification !== 'quote') {
                                allThreadEventsMap.set(ev.id, ev);
                                newParentIds.push(ev.id);
                            }
                        }
                    });
                    currentParentIds = newParentIds;
                }

                const childrenMap = new Map();
                allThreadEventsMap.forEach((ev, id) => {
                    if (id === targetId) return;
                    const parentId = getParentId(ev, targetId);
                    if (!childrenMap.has(parentId)) childrenMap.set(parentId, []);
                    childrenMap.get(parentId).push(ev);
                });

                childrenMap.forEach(arr => arr.sort((a, b) => a.created_at - b.created_at));

                function flattenTree(parentId, currentLevel, result = []) {
                    const children = childrenMap.get(parentId) || [];
                    children.forEach(child => {
                        const cappedLevel = Math.min(currentLevel, 6);
                        result.push({ event: child, level: cappedLevel });
                        flattenTree(child.id, currentLevel + 1, result);
                    });
                    return result;
                }

                const threadedReplies = flattenTree(targetId, 1);
                quoteEvents.sort((a, b) => b.created_at - a.created_at);

                const allPubkeys = [];
                allThreadEventsMap.forEach(ev => allPubkeys.push(ev.pubkey));
                quoteEvents.forEach(ev => allPubkeys.push(ev.pubkey));
                await preloadProfiles(allPubkeys);
                
                renderNoteCard('mainNoteCard', mainEvent, true, 0);

                const repliesListDiv = document.getElementById('repliesList');
                repliesListDiv.innerHTML = '';
                if (threadedReplies.length === 0) {
                    repliesListDiv.innerHTML = `<p class="text-gray-500 text-sm italic">No answers found for this note.</p>`;
                } else {
                    threadedReplies.forEach(item => {
                        const wrapper = document.createElement('div');
                        renderNoteCardIntoElement(wrapper, item.event, false, item.level);
                        repliesListDiv.appendChild(wrapper);
                    });
                }

                const quotesListDiv = document.getElementById('quotesList');
                quotesListDiv.innerHTML = '';
                if (quoteEvents.length === 0) {
                    quotesListDiv.innerHTML = `<p class="text-gray-500 text-sm italic">No citations or mentions found for this note.</p>`;
                } else {
                    quoteEvents.forEach(quote => {
                        const wrapper = document.createElement('div');
                        renderNoteCardIntoElement(wrapper, quote, false, 1, true);
                        quotesListDiv.appendChild(wrapper);
                    });
                }

                document.getElementById('replyCountTab').innerText = threadedReplies.length;
                document.getElementById('quoteCountTab').innerText = quoteEvents.length;

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('mainNoteContainer').classList.remove('hidden');
                document.getElementById('tabsContainer').classList.remove('hidden');
                document.getElementById('repliesContainer').classList.remove('hidden');

            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerText = "Error loading thread.";
            }
        }

        function getParentId(event, rootId) {
            const eTags = event.tags.filter(t => t[0] === 'e' || t[0] === 'E');
            if (eTags.length === 0) return rootId;
            const replyTag = eTags.find(t => t[3] === 'reply');
            if (replyTag && replyTag[1]) return replyTag[1];

            const nonRootTags = eTags.filter(t => t[1] !== rootId && t[3] !== 'root');
            if (nonRootTags.length > 0) {
                return nonRootTags[nonRootTags.length - 1][1];
            }
        
            if (eTags.length > 1) {
                const lastE = eTags[eTags.length - 1][1];
                if (lastE !== rootId) return lastE;
            }
        
            return eTags[0][1] || rootId;
        }

        const KIND_CONFIG = {
            1: { label: "Note", border: "border-l-4 border-gray-600", badge: "bg-gray-800 text-gray-300 border-gray-700" },
            20: { label: "🖼️ Photo", border: "border-l-4 border-pink-500", badge: "bg-pink-950/80 text-pink-300 border-pink-500/40" },
            22: { label: "📹 Short Video", border: "border-l-4 border-purple-500", badge: "bg-purple-950/80 text-purple-300 border-purple-500/40" },
            34236: { label: "🎬 Video (NIP-71)", border: "border-l-4 border-indigo-500", badge: "bg-indigo-950/80 text-indigo-300 border-indigo-500/40" },
            54: { label: "🎙️ Podcast", border: "border-l-4 border-yellow-500", badge: "bg-yellow-950/80 text-yellow-300 border-yellow-500/40" },
            1244: { label: "🎵 Track/Audio", border: "border-l-4 border-green-500", badge: "bg-green-950/80 text-green-300 border-green-500/40" },
            1111: { label: "💬 Comment (1111)", border: "border-l-4 border-blue-500", badge: "bg-blue-950/80 text-blue-300 border-blue-500/40" },
            9802: { label: "Highlights (9802)", border: "border-l-4 border-purple-400", badge: "bg-purple-900/80 text-purple-300 border-purple-500/40" },
            9735: { label: "⚡ Zap", border: "border-l-4 border-yellow-500", badge: "bg-yellow-900/80 text-yellow-300 border-yellow-500/40" }
        };

        function renderNoteCard(containerId, event, isMain, level) {
            const container = document.getElementById(containerId);
            renderNoteCardIntoElement(container, event, isMain, level, false);
        }

        function renderNoteCardIntoElement(container, event, isMain, level, isQuoteSection = false) {
            let npub = '';
            let profileLink = '#';
            let profilePageLink = '#';
            try {
                npub = nip19.npubEncode(event.pubkey);
                profileLink = `profile-social.html?npub=${npub}`;
                profilePageLink = `profile.html?npub=${npub}`;
            } catch(e) {}
        
            const meta = profilesCache.get(event.pubkey) || {};
            const name = meta.display_name || meta.name || (npub ? `${npub.substring(0, 6)}...` : event.pubkey.substring(0, 6));
            const picture = meta.picture || '';
            const imgHtml = picture 
                ? `<img src="${picture}" class="w-5 h-5 rounded-full object-cover shrink-0" loading="lazy" onerror="this.onerror=null; this.parentNode.replaceWith(document.createTextNode('👤'));">`
                : `<span class="text-xs">👤</span>`;
        
            const formattedContent = parseMultiMediaAndContent(event);
            const dateStr = new Date(event.created_at * 1000).toLocaleString();
    
            let replyBadgeHtml = '';
            const eTags = event.tags.filter(t => t[0] === 'e');
            if (eTags.length > 0) {
                const parentTag = eTags.find(t => t[3] === 'reply') || eTags[eTags.length - 1];
                
                if (parentTag && parentTag[1]) {
                    const parentIdHex = parentTag[1];
                    const parentRelay = parentTag[2] || '';
                    
                    let parentIdentifier = parentIdHex;
                    let relayStatusText = "";

                    try {
                        if (parentRelay && parentRelay.startsWith('wss://')) {
                            parentIdentifier = nip19.neventEncode({
                                id: parentIdHex,
                                relays: [parentRelay]
                            });
                            relayStatusText = `(${parentRelay.replace('wss://', '').split('/')[0]})`;
                        } else {
                            parentIdentifier = nip19.noteEncode(parentIdHex);
                            relayStatusText = "(not found relay)";
                        }
                    } catch(e) {
                        relayStatusText = "(not found relay)";
                    }
                    
                    replyBadgeHtml = `<a href="note.html?nevent=${parentIdentifier}" class="inline-flex items-center gap-1 bg-purple-950/80 text-purple-300 text-[10px] px-2.5 py-1 rounded-full border border-purple-500/40 hover:bg-purple-900 transition font-mono max-w-full truncate">💬 <span>Risposta a ${parentIdHex.substring(0, 4)}...</span> <span class="text-gray-400 italic truncate">${relayStatusText}</span></a>`;
                }
            }

            let indentClass = '';
            if (!isMain && !isQuoteSection) {
                const indentClasses = [
                    '',
                    'ml-0', 
                    'ml-2 sm:ml-6 border-l-2 border-purple-500/30 pl-2 sm:pl-3',
                    'ml-4 sm:ml-12 border-l-2 border-purple-500/30 pl-2 sm:pl-3',
                    'ml-6 sm:ml-16 border-l-2 border-purple-500/30 pl-2 sm:pl-3',
                    'ml-8 sm:ml-20 border-l-2 border-purple-500/30 pl-2 sm:pl-3',
                    'ml-10 sm:ml-24 border-l-2 border-purple-500/30 pl-2 sm:pl-3'
                ];
                indentClass = indentClasses[level] || indentClasses[6];
            }

            let kindBorder = '';
            let kindBadgeHtml = '';

            const config = KIND_CONFIG[event.kind] || { 
                label: `Kind ${event.kind}`, 
                border: "border-l-4 border-gray-600", 
                badge: "bg-gray-800 text-gray-300 border-gray-700" 
            };

            kindBorder = config.border;
            kindBadgeHtml = `<span class="text-[10px] px-2 py-0.5 rounded-full border font-mono ${config.badge}">${config.label}</span>`;

            let badgeHtml = '';
            if (!isMain) {
                if (isQuoteSection) {
                    badgeHtml = `<span class="bg-blue-900/60 text-blue-300 text-[10px] px-2 py-0.5 rounded-full border border-blue-500/30">Citazione</span>`;
                } else {
                    badgeHtml = `<span class="bg-purple-900/60 text-purple-300 text-[10px] px-2 py-0.5 rounded-full border border-purple-500/30">Lvl ${level}</span>`;
                }
            }

            container.className = `${isMain 
                ? "bg-gray-900 border-2 border-purple-500/50 p-4 sm:p-6 rounded-2xl shadow-xl" 
                : `bg-gray-900/80 border border-gray-800 p-3 sm:p-4 rounded-xl shadow-md ${kindBorder}`} ${indentClass} transition-all overflow-hidden`;

            container.innerHTML = `
                ${isMain && replyBadgeHtml ? `<div class="mb-3">${replyBadgeHtml}</div>` : ''}
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 mb-3">
                    <div class="flex items-center gap-2 overflow-hidden">                     
                        <a href="${profilePageLink}" class="text-xs text-purple-400 hover:text-purple-300 font-semibold transition truncate flex items-center gap-1.5">
                            ${imgHtml}
                            <span class="truncate max-w-[160px]">${name}</span>
                            <span class="text-[10px] text-gray-500 font-mono">(${npub ? `${npub.substring(0, 6)}...` : ''})</span>
                        </a>
                        <a href="${profileLink}" target="_blank" class="text-[10px] text-gray-500 hover:underline shrink-0">(Social)</a>
                    </div>
                    <div class="flex items-center gap-1.5 flex-wrap justify-start sm:justify-end">
                        ${!isMain ? replyBadgeHtml : ''}
                        ${kindBadgeHtml}
                        ${badgeHtml}
                        <span class="text-[11px] text-gray-500">${dateStr}</span>
                    </div>
                </div>
                <div class="text-gray-200 whitespace-pre-wrap text-xs sm:text-sm leading-relaxed break-words">${formattedContent}</div>
            `;
        }

        function parseMultiMediaAndContent(event) {
            let content = event.content || '';
            let mediaItems = [];
            let cleanContent = content;

            // 1. Estrazione robusta dai TAG (Kind 20, 22, 34236, imeta, url, image)
            if (event.tags) {
                event.tags.forEach(t => {
                    if (t[0] === 'imeta') {
                        let url = '';
                        let mime = '';
                        t.forEach(part => {
                            if (part.startsWith('url ')) url = part.replace('url ', '').trim();
                            if (part.startsWith('m ')) mime = part.replace('m ', '').trim().toLowerCase();
                        });
                        if (url && !mediaItems.some(m => m.url === url)) {
                            mediaItems.push({ url, mime });
                        }
                    } else if (['url', 'imurl', 'image', 'video', 'audio'].includes(t[0])) {
                        if (t[1] && !mediaItems.some(m => m.url === t[1])) {
                            mediaItems.push({ url: t[1], mime: t[0] });
                        }
                    } else {
                        // Controllo generico per qualsiasi tag che contenga un URL valido
                        for (let i = 1; i < t.length; i++) {
                            if (typeof t[i] === 'string' && t[i].startsWith('http')) {
                                let url = t[i].trim();
                                if (!mediaItems.some(m => m.url === url)) {
                                    mediaItems.push({ url, mime: t[0] });
                                }
                                break;
                            }
                        }
                    }
                });
            }

            // 2. Estrazione dal testo (per URL normali inseriti nella nota)
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            let matches = [...content.matchAll(urlRegex)];
            matches.forEach(match => {
                let url = match[0].replace(/[.,!?)]$/, '');
                let lower = url.toLowerCase();
                if (lower.match(/\.(jpeg|jpg|gif|png|webp|svg|mp4|webm|mov|ogg|mp3|wav|m4a)(\?.*)?$/i) || lower.includes('imgur') || lower.includes('primal.net/media') || lower.includes('youtube.com') || lower.includes('youtu.be')) {
                    if (!mediaItems.some(m => m.url === url)) {
                        mediaItems.push({ url, mime: '' });
                        cleanContent = cleanContent.replace(url, '');
                    }
                }
            });

            if (event.kind === 20 && cleanContent.trim() === '' && mediaItems.length > 0) {
                cleanContent = '';
            }

            let parsedText = cleanContent.trim() ? cleanContent.replace(/nostr:(npub1[a-z0-9]+|nprofile1[0-9a-z]+|note1[a-z0-9]+|nevent1[0-9a-z]+|naddr1[0-9a-z]+)/gi, (match, entity) => {
                let url = '#';
                let label = entity.substring(0, 8) + '...';
                if (entity.startsWith('npub') || entity.startsWith('nprofile')) {
                    label = '👤 ' + label;
                    url = `profile.html?npub=${entity}`;
                } else if (entity.startsWith('note') || entity.startsWith('nevent')) {
                    label = '💬 ' + label;
                    url = `note.html?nevent=${entity}`;    
                } else if (entity.startsWith('naddr')) {
                    label = '📚 ' + label;
                    url = `modfile.html?naddr=${entity}`;
                }
                return `<a href="${url}" target="_blank" class="text-purple-400 bg-purple-950/60 border border-purple-800/60 px-1.5 py-0.5 rounded text-[11px] sm:text-xs inline-block font-mono hover:underline max-w-full truncate align-bottom">${label}</a>`;
            }) : '';

            let mediaHtml = '';

            if (mediaItems.length === 1) {
                let m = mediaItems[0];
                if (m.mime.includes('video') || m.url.match(/\.(mp4|webm|mov|ogg)(\?.*)?$/i)) {
                    mediaHtml = `<div class="w-full bg-black mb-3 rounded-xl overflow-hidden"><video src="${m.url}" controls preload="none" class="w-full max-h-[450px] mx-auto"></video></div>`;
                } else if (m.mime.includes('audio') || m.url.match(/\.(mp3|wav|ogg|m4a)(\?.*)?$/i)) {
                    mediaHtml = `<div class="p-4 bg-gray-800/80 border border-gray-700 rounded-xl mb-3 flex items-center gap-3"><span class="text-2xl">🎵</span><audio src="${m.url}" controls preload="none" class="w-full h-10"></audio></div>`;
                } else if (m.url.includes('youtube.com') || m.url.includes('youtu.be')) {
                    let videoId = m.url.includes('youtu.be/') ? m.url.split('youtu.be/')[1]?.split('?')[0] : m.url.split('watch?v=')[1]?.split('&')[0];
                    mediaHtml = `<div class="w-full aspect-video bg-black mb-3 rounded-xl overflow-hidden"><iframe class="w-full h-full" src="https://www.youtube-nocookie.com/embed/${videoId}" loading="lazy" frameborder="0" allowfullscreen></iframe></div>`;
                } else {
                    mediaHtml = `<div class="w-full bg-black flex items-center justify-center max-h-[450px] overflow-hidden mb-3 rounded-xl"><img src="${m.url}" class="w-full object-cover max-h-[450px]" loading="lazy" decoding="async"></div>`;
                }
            } else if (mediaItems.length > 1) {
                let slidesHtml = mediaItems.map((m, index) => {
                    let slideContent = '';
                    if (m.url.match(/\.(mp4|webm|mov|ogg)(\?.*)?$/i)) {
                        slideContent = `<video src="${m.url}" controls preload="none" class="w-full h-full object-contain bg-black"></video>`;
                    } else if (m.url.match(/\.(mp3|wav|ogg|m4a)(\?.*)?$/i)) {
                        slideContent = `<div class="p-6 bg-gray-900 flex flex-col items-center justify-center w-full h-full gap-4"><span class="text-4xl">🎵</span><audio src="${m.url}" controls preload="none" class="w-full"></audio></div>`;
                    } else {
                        slideContent = `<img src="${m.url}" class="w-full h-full object-cover" loading="lazy" decoding="async">`;
                    }
                    return `
                        <div class="w-full h-full shrink-0 relative bg-black flex items-center justify-center">
                            ${slideContent}
                            <span class="absolute top-3 right-3 bg-black/70 text-white text-[10px] px-2 py-0.5 rounded-full font-mono">${index + 1}/${mediaItems.length}</span>
                        </div>
                    `;
                }).join('');

                mediaHtml = `
                    <div class="relative w-full max-h-[450px] aspect-square overflow-hidden bg-black mb-3 rounded-xl">
                        <div class="flex w-full h-full overflow-x-auto snap-x snap-mandatory scrollbar-none">
                            ${slidesHtml}
                        </div>
                    </div>
                `;
            }

            return mediaHtml + (parsedText ? `<div class="mt-2">${parsedText}</div>` : '');
        }

        initThread();
    </script>
</body>
</html>
